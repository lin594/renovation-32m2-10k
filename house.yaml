# ============================================================================
# 老房装修改造 · 户型与方案上下文数据包（机器可读）
# version: 4    date: 2026-08-30
# 用途：将本文件整体转发给 AI / 设计师，即可在其基础上继续装修方案咨询
# 坐标系：原点=客厅西北角；+x=南(图向下)；+y=东(图向右)；单位=米
# ============================================================================

meta:
  project: "旧房内部装修改造（不改墙体、不改结构）"
  gross_area_m2: 32.0
  layout: "一室一厅一厨一卫 + 转角阳台"
  occupants: 2          # 情侣两人，双人床
  pet: "猫（需要猫爬架）"
  top_goals: ["小空间最大化", "卫生间极限布局", "全屋收纳"]

coordinate_system:
  origin: "客厅西北角 (0,0)"
  x_axis: "+x 向南（平面图向下）"
  y_axis: "+y 向东（平面图向右）"
  compass: { N: "-x", S: "+x", W: "-y", E: "+y" }
  unit: "米"
  wall_thickness: 0.24
  door_height: 1.9
  accuracy: "坐标为名义值（≈墙中线），实测存在±0.1级墙厚误差"

geometry:
  main_rectangle: { x: [0, 4], y: [0, 8] }
  cutout_public_corridor: { x: [3, 4], y: [5, 8], note: "非套内" }
  balcony_addon: { x: [4, 5], y: [0, 3] }
  area_check_m2: 32.0

rooms:
  - { id: living,  name: "客厅",        x: [0, 4],   y: [0, 3], net: [4.0, 3.0], note: "净尺寸已确认" }
  - { id: balcony, name: "转角阳台",    x: [4, 5],   y: [0, 3], nominal: [1.0, 3.0], net_width: "~0.85(待实测)", note: "西+南两面近整面窗（非落地）" }
  - { id: kitchen, name: "厨房",        x: [0, 2],   y: [3, 5], net: "东西2.0 × 南北<2.0" }
  - { id: bath,    name: "卫生间",      x: [2, 3.2], y: [3, 4], net: "x<1.2, y<0.9", note: "外墙实测1.3×1.0；设计基准净≈1.05×0.75" }
  - { id: bedroom, name: "卧室",        x: [0, 3],   y: [5, 8], net: [3.0, 3.0], note: "净尺寸已确认" }
  - { id: hall_a,  name: "走廊A(玄关)", x: [3.2, 4], y: [3, 5], net_width: 0.8 }
  - { id: hall_b,  name: "走廊B",       x: [2, 3.2], y: [4, 5], note: "与走廊A成L形连通，无隔墙" }

doors:
  - id: entry
    name: "入户门"
    wall: "y=5（走廊A东墙）"
    opening: { x: [3.2, 4] }
    width: 0.8
    type: "平开，外开进公共走廊"
    hinge: "x=4"
  - id: bedroom
    wall: "y=5（卧室西墙）"
    opening: { x: [2.2, 3] }
    width: 0.8
    type: "平开，内开进卧室，顺时针"
    hinge: "x=3"
    open_position: "门扇开启后贴卧室南墙(x=3)内侧，占y[5,5.8]"
  - id: kitchen
    wall: "x=2（厨房南墙）"
    opening: { y: [4.2, 5] }
    width: 0.8
    type: "隐藏滑门"
    panel_park: "厨房内侧贴墙 y[3.4,4.1]（高窗下方，窗台无冲突）"
  - id: bath
    wall: "x=3.2（卫生间南墙）"
    opening: { y: [3.05, 3.75] }
    width: 0.7
    type: "隐藏滑门，面板装走廊A侧，沿墙东西滑"
    panel_closed: "y[3.05,3.75]"
    panel_open: "y[3.75,4.45]（0.25压墙垛+0.45悬挑进A/B交汇口）"
    behavior: "只能向东开（西侧仅~0.05m墙垛）；开启时侵占走廊空间，关闭时走廊B才能正常使用"
    effective_clear_width: 0.65   # 浴室柜压门洞东侧5cm
  - id: balcony_slider
    wall: "x=4（客厅/阳台隔墙）"
    opening: { y: [1.5, 3] }
    width: 1.5
    type: "双扇推拉门，同槽互滑"
    behavior: "东扇固定（被阳台收纳柜挡）；仅西扇向东滑开启"
    effective_opening: "y[1.5,2.2]（~0.7m）"
    note: "面板不出槽→冰箱南面可完全贴墙，无需留缝"
  - id: passage
    name: "通道口（无门）"
    wall: "y=3（走廊A西墙）"
    opening: { x: [3.2, 4] }
    width: 0.8

windows:
  - { wall: "x=0", span: "y[1,2]",     room: "客厅",   width: 1.0 }
  - { wall: "x=0", span: "y[3.5,4.5]", room: "厨房",   width: 1.0, note: "油烟机挂此窗上" }
  - { wall: "x=0", span: "y[6,7]",     room: "卧室",   width: 1.0, note: "床沿窗下" }
  - { wall: "y=0", span: "x[4.05,4.95]", room: "阳台", note: "近整面非落地" }
  - { wall: "x=5", span: "y[0.1,2.9]",  room: "阳台", note: "近整面非落地" }
  - { wall: "x=2", span: "y[3.35,3.85]", rooms: "厨房↔卫生间", size: "0.5宽×0.5高", note: "高窗近顶，厨卫通风用" }

electrical:
  - { item: "入户配电箱", location: "y=5墙门垛 x[3,3.2] 上方", constraint: "预留检修位，不可封死" }

plumbing:   # 全部已布好，点位不可改
  drain_stack: { location: "卫生间西北角(2,3)", note: "全屋唯一排水立管" }
  water_inlet: "仅卫生间内有进水"
  fixtures:
    - { name: "厨房水槽", location: "厨房西南角", rect: [1.2, 2, 3, 3.4] }
    - { name: "洗衣机", location: "客厅东南角，东面贴卫生间西墙(y=3)", rect: [2.4, 3.2, 2.2, 3], note: "排水经y=3墙接入卫生间立管" }

furniture_plan:   # rect格式 [x1,x2,y1,y2]，名义近似
  living_room:
    - { item: "双人沙发", rect: [0, 1.6, 0, 0.9], orient: "靠西墙，面朝东" }
    - { item: "投影仪", mount: "西墙沙发上方高位壁装", throw_m: 2.85, screen: "y=3墙 x[0.3,1.7]实墙段（无门无窗）", max_image: "100~110寸", note: "光路无家具遮挡（已校核）" }
    - { item: "书桌", rect: [2.5, 3.2, 0.2, 1.5], size: "1.3×0.7", orient: "西缘贴墙，东缘与冰箱对齐于y=1.5", note: "坐北侧朝南" }
    - { item: "冰箱", rect: [3.3, 4, 0.8, 1.5], orient: "南面完全贴x=4墙，东缘平阳台门洞西缘(y=1.5)；门朝东、北铰链、向东北旋开" }
    - { item: "猫爬架/杂物角", rect: [3.3, 4, 0.1, 0.8], note: "四面围合（书桌南沿/西墙/x=4墙/冰箱西沿）；猫可从桌下进出，人手难进入（见issues）" }
    - { item: "滚筒洗衣机", rect: [2.4, 3.2, 2.2, 3], orient: "东面贴卫生间西墙，正面朝南，东南角=(3.2,3)" }
    - { item: "餐桌", rect: [1.6, 2.4, 2.2, 3], size: "0.8×0.8", note: "洗衣机北侧；建议无背靠凳便于收进桌下" }
    - { item: "茶几", status: "不做" }
  balcony:
    - { item: "收纳柜", rect: [4, 5, 2.5, 3], note: "最东端，封死阳台门东扇" }
    - { item: "晾衣区", rect: [4, 5, 0, 2.5], note: "建议顶装升降晾衣杆" }
  kitchen:
    - { item: "瓷砖水泥台面(已有)", rect: [0, 0.8, 3, 5], size: "南北0.8×东西2.0", note: "北墙整墙，保留" }
    - { item: "灶台", rect: [0, 0.8, 4.2, 5], note: "台面东端，紧邻壁龛；油烟机挂北窗上" }
    - { item: "壁龛(已有)", location: "厨房东墙(y=5)近北端", use: "放调料" }
    - { item: "水槽", rect: [1.2, 2, 3, 3.4], note: "西南角；台面宽度受滑门停泊位限制（见issues）" }
  bathroom:   # 全间按湿区(wet room)设计
    - { item: "排水立管", location: "西北角(2,3)" }
    - { item: "马桶", rect: [2, 2.7, 3.1, 3.5], orient: "贴北墙朝南，位于立管东侧", note: "前净距仅~0.3m→建议壁挂或紧凑款(深≤0.7)" }
    - { item: "淋浴", rect: [2.5, 3.15, 3, 3.55], note: "花洒装西墙南段+浴帘；地面整体向西北立管找坡" }
    - { item: "浴室柜", rect: [2.8, 3.2, 3.7, 4], size: "0.3(东西)×0.4(南北)", note: "东南角，壁挂+防水材质；压门洞5cm" }
  bedroom:
    - { item: "双人床1.3×2.0", rect: [0, 1.3, 5, 7], orient: "床头贴西墙(y=5)，北侧紧靠北墙(x=0)" }
    - { item: "顶天立地衣柜", rect: [0, 3, 7.1, 8], depth: 0.9, note: "东墙整面；必须推拉门；北段被床挡（见issues）" }
    - { item: "床头柜(可选)", rect: [1.3, 1.9, 5, 5.6], size: "0.5宽" }

circulation:
  paths:
    - "入户 → 走廊A → 北墙:卫生间滑门 / 西墙通道口:客厅"
    - "走廊A → 走廊B → 尽头:厨房滑门；东侧:卧室门"
    - "客厅入户缓冲区(x[3.2,4]×y[1.5,3]) → 南:阳台门(有效0.7m) / 北:通道带"
  critical_bottleneck:
    location: "通道带 x[2.5,3.2]×y[1.5,2.2]（书桌与洗衣机之间）"
    clear_width: "~0.7"
    role: "客厅西区(沙发/书桌/餐桌) ↔ 入户/阳台 的唯一路线，必须保持净空"
  notes:
    - "卫生间滑门开启时面板悬挑y[3.75,4.45]，A→B绕行南侧(净~0.55m)"
    - "冰箱门开启时短暂占用冰箱东侧过道（瞬时）"

issues:   # AI分析发现的问题，待用户决策
  - { id: cat_corner_access, desc: "猫爬架角四面围合，人无法进入（猫可从桌下进出）", options: ["接受纯猫用", "书桌西段缩短留操作口", "冰箱西移留缝"] }
  - { id: wardrobe_north_blocked, desc: "衣柜北段x[0,1.3]被床尾挡死（床尾y=7与柜体y=7.1仅剩0.1m）", options: ["衣柜缩短至x[1.3,3](可用1.7m)", "北段做不常取物区", "床南移(牺牲紧靠北墙)"], constraint: "必须推拉门" }
  - { id: bath_wet_room, desc: "唯一排水在西北角→全间湿区；马桶前净距~0.3m；浴室柜会溅湿；门洞净0.65m" }
  - { id: bath_ventilation, desc: "卫生间无外窗，仅厨卫高窗通风；吊顶内有无排风井待确认" }
  - { id: kitchen_counter_narrow, desc: "厨房滑门面板停厨房内侧压高窗，水槽台面仅~0.35m宽", proposal: "面板改停走廊B侧→台面~1.2m；代价走廊B局部净宽0.8→0.65" }
  - { id: balcony_door_narrow, desc: "阳台门有效开口仅0.7m（西扇），搬运大件受限" }

confirmed_facts:   # 已确认，无需再问
  - "方位: -x北 +x南 -y西 +y东"
  - "客厅/卧室为净尺寸；走廊A净宽0.8；厨房净: 东西2.0×南北<2.0"
  - "卫生间净: x<1.2, y<0.9（外墙实测1.3×1.0）"
  - "入户门x[3.2,4]铰链x=4外开；卧室门x[2.2,3]铰链x=3内开"
  - "厨卫隔墙x=2；高窗窗台与滑门停泊无冲突"
  - "走廊A/B无隔墙，连续L形"
  - "阳台推拉门同槽互滑: 东扇固定，西扇东滑"
  - "冰箱/书桌东缘对齐y=1.5；浴室柜压门洞5cm（接受）；床头朝西贴北墙"
  - "给排水点位全部确定且已施工（不可改）"
  - "配电箱在y=5墙门垛上方（留检修）"

open_questions:   # 当前待定，咨询时可优先回答这些
  - "热水器：电/燃气？位置？（电热常挂马桶上方~1.9m；燃气须厨房且距卫生间远）"
  - "卫生间吊顶内有无排风井/风道？"
  - "厨房滑门面板是否改停走廊B侧以加宽水槽台面？"
  - "衣柜推拉门确认？北段处理方案？"
  - "猫爬架角的人手可达性是否需要解决？"
  - "阳台净宽实测值（推算~0.85）"

discussion_roadmap:
  1: "卫生间深化（防水高度/找坡/挡水条/洁具选型）"
  2: "玄关+走廊收纳（走廊A南墙y[3.05,3.7]×0.2m薄鞋柜位）"
  3: "阳台晾晒与收纳平衡"
  4: "客厅/卧室电路（投影仪取电）"
