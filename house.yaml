surface_finishes:
  source: "data/finishes.yaml"
  wall_old_skin: "已基本铲平"
  floor_existing: "瓷砖"
  style: "宋氏美学 + 侘寂中古，偏暖黄色"
  tile_recolor_scope: "厨房和卫生间四面墙约1.8m高的白色瓷砖，以及厨房现有瓷砖灶台"

circulation:
  paths:
    - "入户 → 走廊A → 北墙:卫生间滑门 / 西墙通道口:客厅"
    - "走廊A → 走廊B → 尽头:厨房滑门；东侧:卧室门"
    - "客厅入户缓冲区(x[3.2,4]×y[1.5,3]) → 南:阳台门(有效0.7m) / 北:通道带"
  critical_bottleneck:
    location: "通道带 x[2.5,3.2]×y[1.5,2.2]（书桌与洗衣机之间）"
    clear_width: "~0.7"
    role: "客厅西区(沙发/书桌/餐桌) ↔ 入户/阳台 的唯一路线，必须保持净空"
  notes:
    - "卫生间滑门旧候选开启位置会侵入A/B交汇口；定制必须重新解决，整体图不画挡路的开启门扇"
    - "冰箱门开启时短暂占用冰箱东侧过道（瞬时）"

issues:   # AI分析发现的问题，待用户决策
  - { id: corner_access, desc: "书桌与冰箱形成约0.6×0.8m角落；桌下虽空但常被椅子挡住", status: "功能待定" }
  - { id: wardrobe_north_blocked, desc: "衣柜北段x[0,1.3]被床挡住，取物困难", options: ["衣柜缩短至x[1.3,3]", "北段做不常取物区", "调整床位"], closure: "帘子" }
