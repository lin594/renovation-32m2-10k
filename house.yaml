# ============================================================================
# 老房装修改造 · 户型与方案上下文数据包（机器可读）
# version: 5    date: 2026-08-31
# 用途：将本文件整体转发给 AI / 设计师，即可在其基础上继续装修方案咨询
# 坐标系：原点=客厅西北角；+x=南(图向下)；+y=东(图向右)；单位=米
# ============================================================================

meta:
  project: "旧房内部装修改造（不改墙体、不改结构）"
  gross_area_m2: 32.0
  layout: "一室一厅一厨一卫 + 转角阳台"
  occupants: 2          # 情侣两人，双人床
  pets: { species: "猫", count: 3, needs: ["防逃纱窗", "猫抓板", "猫爬/活动空间"] }
  owner_role: "业主兼实际策划人"
  lifecycle_scope: "二手房购入后 → 设计/拆旧/采购/施工/验收 → 可入住"
  top_goals: ["低成本高性价比", "小空间最大化", "卫生间极限布局", "全屋收纳", "三猫家庭安全"]
  design_style: { primary: "宋氏美学", supporting: ["侘寂", "中古"], color: "偏暖黄色" }
  finishes_ref: "data/finishes.yaml"

coordinate_system:
  origin: "客厅西北角 (0,0)"
  x_axis: "+x 向南（平面图向下）"
  y_axis: "+y 向东（平面图向右）"
  compass: { N: "-x", S: "+x", W: "-y", E: "+y" }
  unit: "米"
  wall_thickness: 0.24
  door_height: 1.9
  ceiling_height: 2.65
  suspended_ceiling: false
  accuracy: "坐标为名义值（≈墙中线），实测存在±0.1级墙厚误差"

geometry:
  main_rectangle: { x: [0, 4], y: [0, 8] }
  cutout_public_corridor: { x: [3, 4], y: [5, 8], note: "非套内" }
  balcony_addon: { x: [4, 5], y: [0, 3] }
  area_check_m2: 32.0

rooms:
  - { id: living,  name: "客厅",        x: [0, 4],   y: [0, 3], net: [4.0, 3.0], note: "净尺寸已确认" }
  - { id: balcony, name: "转角阳台",    x: [4, 5],   y: [0, 3], nominal: [1.0, 3.0], net_width: "~0.85(待实测)", note: "西+南两面近整面窗（非落地）" }
  - { id: kitchen, name: "厨房",        x: [0, 2],   y: [3, 5], net: "东西2.0 × 南北<2.0" }
  - { id: bath,    name: "卫生间",      x: [2, 3.2], y: [3, 4], net: "x<1.2, y<0.9", note: "外墙实测1.3×1.0；设计基准净≈1.05×0.75" }
  - { id: bedroom, name: "卧室",        x: [0, 3],   y: [5, 8], net: [3.0, 3.0], note: "净尺寸已确认" }
  - { id: hall_a,  name: "走廊A(玄关)", x: [3.2, 4], y: [3, 5], net_width: 0.8 }
  - { id: hall_b,  name: "走廊B",       x: [2, 3.2], y: [4, 5], note: "与走廊A成L形连通，无隔墙" }

doors:
  - id: entry
    name: "入户门"
    wall: "y=5（走廊A东墙）"
    opening: { x: [3.2, 4] }
    width: 0.8
    type: "平开，外开进公共走廊"
    hinge: "x=4"
  - id: bedroom
    wall: "y=5（卧室西墙）"
    opening: { x: [2.15, 2.95] }
    width: 0.8
    type: "平开，内开进卧室，顺时针"
    procurement_status: not_purchased
    procurement_ref: BUY-0008
    hinge: "x≈2.95"
    note: "较旧图整体向北修正约0.05m；旧铁门已拆，计划门型保留"
    old_door_status: removed
  - id: kitchen
    wall: "x=2（厨房南墙）"
    opening: { y: [4.2, 5] }
    width: 0.8
    type: "隐藏滑门"
    procurement_status: pending_custom_order
    procurement_ref: BUY-0001
    panel_park: "厨房内侧贴墙 y[3.4,4.1]（高窗下方，窗台无冲突）"
    old_door_status: removed
  - id: bath
    wall: "x=3.2（卫生间南墙）"
    opening: { y: [3.05, 3.75] }
    width: 0.7
    type: "隐藏滑门，面板装走廊A侧，沿墙东西滑"
    procurement_status: pending_custom_order
    procurement_ref: BUY-0002
    panel_closed: "y[3.05,3.75]"
    panel_open_legacy_candidate: "y[3.75,4.45]（旧估算会侵入A/B交汇口，不能直接作为定制依据）"
    design_constraint: "定制方案和总平面图均不得让门扇遮挡正常通道；精确停泊位置待门详图解决"
    drawing_rule: "总平面只画关闭状态/开启方向，不把待定开启门扇画在通道中"
    effective_clear_width: 0.65   # 浴室柜压门洞东侧5cm
    old_door_status: removed
  - id: balcony_slider
    wall: "x=4（客厅/阳台隔墙）"
    opening: { y: [1.5, 3] }
    width: 1.5
    type: "双扇推拉门，同槽互滑"
    behavior: "东扇固定（被阳台收纳柜挡）；仅西扇向东滑开启"
    effective_opening: "y[1.5,2.2]（~0.7m）"
    note: "面板不出槽→冰箱南面可完全贴墙，无需留缝"
  - id: passage
    name: "通道口（无门）"
    wall: "y=3（走廊A西墙）"
    opening: { x: [3.2, 4] }
    width: 0.8
    old_door_status: removed

windows:
  - { wall: "x=0", span: "y[1,2]",     room: "客厅",   width: 1.0 }
  - { wall: "x=0", span: "y[3.5,4.5]", room: "厨房",   width: 1.0, note: "油烟机挂此窗上" }
  - { wall: "x=0", span: "y[6,7]",     room: "卧室",   width: 1.0, note: "床沿窗下" }
  - { wall: "y=0", span: "x[4.05,4.95]", room: "阳台", note: "近整面非落地" }
  - { wall: "x=5", span: "y[0.1,2.9]",  room: "阳台", note: "近整面非落地" }
  - { wall: "x=2", span: "y[3.35,3.85]", rooms: "厨房↔卫生间", size: "0.5宽×0.5高", note: "高窗近顶，厨卫通风用" }
  - { scope: "全部外窗", plan: "更换三猫家庭防逃纱窗", status: todo, requirement: "纱网、边框与锁扣均需防猫推开/抓破" }

electrical:
  current_state:
    incoming_line_and_panel: completed
    indoor_old_wiring: fully_removed
    indoor_new_wiring: todo_surface_mounted
    protective_earth: "老小区无地线（业主口述；待专业检测确认）"
  panel:
    location: "y=5墙，入户门与卧室门之间墙面上方（约x[2.95,3.2]区域）"
    constraint: "预留检修位，不可封死"
    devices:
      - { item: "空气开关总闸", count: 1 }
      - { item: "延时送电器", count: 1 }
      - { item: "漏电保护器", count: 3 }
      - { item: "空气开关", count: 2 }
  incoming_work:
    cost_ref: EXP-0001
    cable: { spec: "6平方毫米铜线", color: "蓝色", purchased_m: 100, used_m_approx: 40, remaining_m_approx: 60, inventory_ref: INV-0001 }
  plan:
    wiring_method: "全屋明装线槽/明管"
    main_feed_proposal: "余下蓝色6平方线用于配电箱到各房间主线；拟用改色电工胶布区分火线/零线"
    proposal_status: "待安全与合规核验，未批准施工"
  recessed_boxes:
    - { location: "冰箱位置南侧", status: existing, plan: "优先利用" }
    - { location: "洗衣机东侧", status: existing, plan: "优先利用" }
    - { location: "卧室门北侧", status: existing, plan: "优先利用" }
    - { fallback: "暗盒不适用的位置再增加明盒" }
  wall_holes:
    - { id: E-HOLE-01, location: "卧室门洞最北端", nominal_coordinate: "(x≈2.15,y=5)" }
    - { id: E-HOLE-02, location: "厨房门洞最西端", nominal_coordinate: "(x=2,y≈4.2)" }
    - { id: E-HOLE-03, location: "卫生间门洞最东端", nominal_coordinate: "(x=3.2,y≈3.75)" }
    - { id: E-HOLE-04, location: "客厅通道口最北端", nominal_coordinate: "(x=3.2,y=3)" }
  fixed_equipment:
    - { item: "客厅壁挂式空调", location: "客厅南墙冰箱上方", status: existing }
    - { item: "卧室壁挂式空调", location: "卧室西墙双人床床头上方", status: existing }
    - { item: "卧室吊扇", location: "卧室中心上方", status: existing }
    - { item: "客厅吊扇钩", location: "客厅中心上方", status: existing_hook_without_fan }
    - { item: "卫生间浴霸", location: "卫生间东墙偏北", status: existing_safety_concern, risk_ref: SAF-0003 }

low_voltage:
  internet_entry:
    location: "入户门北侧穿线洞（与入户电线共用门洞位置）"
    nominal_coordinate: "(x≈3.2,y=5)"
    status: planned
  equipment_shelf:
    location: "玄关南侧墙面"
    equipment: ["光猫", "Wi-Fi路由器"]
    type: "壁挂置物架"
    status: planned
    requirements: ["附近供电", "散热", "可检修", "避免与强电线槽挤占"]

plumbing:   # 本轮描述的水路已完成，点位原则上不可改
  drain_stack: { location: "卫生间西北角(2,3)", note: "全屋唯一排水立管" }
  water_inlet: "卫生间西墙偏北"
  completed_work_ref: WORK-0002
  cold_water_routes:
    - "入户点沿卫生间西墙向北，再转向西设置马桶进水孔"
    - "入户点向南设置浴室柜进水孔"
    - "另一路向北穿墙进入厨房燃气热水器"
    - "向西穿客厅墙到洗烘一体机进水口"
  hot_water_routes:
    - "燃气热水器出水回送卫生间"
    - "水槽位置设置冷、热水接口各一；接口目前高于水槽"
    - "淋浴位置设置冷、热水接口各一并接入淋浴设备"
  drainage_routes:
    - "洗烘一体机排水管低位穿墙接卫生间防臭地漏"
    - "洗衣机地漏与马桶最终共用排水管道"
  fixtures:
    - { name: "厨房水槽", location: "厨房西南角", rect: [1.2, 2, 3, 3.4] }
    - { name: "洗烘一体滚筒洗衣机", location: "客厅东南角，东面贴卫生间西墙(y=3)", rect: [2.4, 3.2, 2.2, 3], procurement_status: not_purchased, procurement_ref: BUY-0003, note: "排水经y=3墙接入卫生间防臭地漏" }

gas:
  inlet: { location: "厨房东墙靠北、灶台上方", status: existing }
  branches:
    - { target: "燃气灶", route: "从入户燃气点直接连接燃气灶" }
    - { target: "燃气热水器", route: "入户后沿厨房北墙向西约2m，再向南接入热水器" }
  water_heater: { type: "燃气", location: "厨房西墙靠南、水槽上方", status: existing_or_planned_position }
  concealment: "北墙段燃气管计划位于架空瓷砖台面下方"
  acceptance: "管道可见性、检修、通风、与灶具/电气/水点距离须按所在地燃气验收要求确认"

furniture_plan:   # rect格式 [x1,x2,y1,y2]，名义近似
  living_room:
    - { item: "双人沙发", rect: [0, 1.6, 0, 0.9], orient: "靠西墙，面朝东", procurement_status: not_purchased, procurement_ref: BUY-0006 }
    - { item: "投影仪", mount: "西墙沙发上方高位壁装", throw_m: 2.85, screen: "y=3墙 x[0.3,1.7]实墙段（无门无窗）", max_image: "100~110寸", note: "光路无家具遮挡（已校核）" }
    - { item: "书桌和椅子", rect: [2.5, 3.2, 0, 1.3], size: "书桌约1.3×0.7", orient: "西侧完全贴墙；东侧与冰箱东侧平齐于y≈1.3", note: "桌下留空，但日常被座椅挡住", procurement_status: not_purchased, procurement_ref: BUY-0007 }
    - { item: "冰箱", rect: [3.3, 4, 0.6, 1.3], orient: "南面贴x=4墙；东侧与书桌东侧平齐；门朝东、北铰链、向东北旋开" }
    - { item: "书桌/冰箱形成的角落", rect: [3.2, 4, 0, 0.6], status: "功能待定", note: "书桌下方虽空，但座椅常会挡住进出" }
    - { item: "洗烘一体滚筒洗衣机", rect: [2.4, 3.2, 2.2, 3], orient: "东面贴卫生间西墙，正面朝南，东南角=(3.2,3)", procurement_status: not_purchased, procurement_ref: BUY-0003 }
    - { item: "餐桌", rect: [1.6, 2.4, 2.2, 3], size: "0.8×0.8", note: "洗衣机北侧；建议无背靠凳便于收进桌下" }
    - { item: "茶几", status: "不做" }
    - { item: "扫地机器人", status: "已有，位置待定", requirements: ["需要电源", "无需上下水", "前方回充通道净空"], inventory_ref: INV-0006 }
  balcony:
    - { item: "收纳柜", rect: [4, 5, 2.5, 3], note: "最东端，封死阳台门东扇" }
    - { item: "升降晾衣架（靠客厅）", rect: [4, 5, 0, 2.5], status: "已安装，可升降" }
    - { item: "升降晾衣架（另一条）", rect: [4, 5, 0, 2.5], status: "升降功能损坏，保留并固定使用" }
    - { item: "猫抓板", location: "阳台西墙和南墙窗户下方", status: planned }
  kitchen:
    - { item: "瓷砖水泥台面(已有)", rect: [0, 0.5, 3, 5], size: "南北0.5×东西2.0", note: "沿厨房北墙铺满，保留；本轮口述尺寸优先于旧版0.8m记录" }
    - item: "架空瓷砖台面（计划）"
      footprint: "位于现有2m台面上方，立面叠层而非新增地面占地"
      tiles: { count: 3, each_m: [0.4, 0.6], total_nominal_m: [0.4, 1.8] }
      support: "伸缩杆"
      use: "夹层放锅具；灶台位于新架设台面上方"
      status: todo_safety_review
      note: "北侧燃气管计划被包含在该瓷砖台面下方"
    - { item: "灶台", location: "架空瓷砖台面上方、厨房东端靠北", note: "油烟机挂北窗上；与燃气管、伸缩杆和瓷砖的净空待核验" }
    - { item: "壁龛(已有)", location: "厨房东墙(y=5)近北端", use: "放调料" }
    - { item: "水槽", rect: [1.2, 2, 3, 3.4], note: "西南角；台面宽度受滑门停泊位限制（见issues）" }
    - { item: "二层木柜(已有)", location: "水槽与北墙现有台面之间", height_relation: "与现有台面平齐", condition: "受潮略有损坏", decision: "保留修复或更换待定" }
  bathroom:   # 全间按湿区(wet room)设计
    - { item: "排水立管", location: "西北角(2,3)" }
