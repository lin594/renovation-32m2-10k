<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" data-diagram-role="living-electrical" role="img">
<title>23 电气｜客厅节点与点位图</title>
<desc>客厅明装电气节点、末端点位与照明控制；讨论图</desc>

<defs>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="12" height="12" fill="#f1f5f9"/><line y2="12" stroke="#cbd5e1" stroke-width="4"/>
  </pattern>
  <pattern id="danger" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#fff1f2"/><line y2="10" stroke="#fecaca" stroke-width="3"/>
  </pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#334155"/></marker>
  <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#2563eb"/></marker>
  <style>
    text{font-family:"Source Han Sans SC","Heiti SC","Arial Unicode MS",sans-serif}
    .wall{fill:none;stroke:#1f2937;stroke-width:7;stroke-linecap:square;stroke-linejoin:miter}
    .iw{fill:none;stroke:#475569;stroke-width:5;stroke-linecap:square}
    .win{stroke:#0284c7;stroke-width:8}.winc{stroke:#e0f2fe;stroke-width:2.5}
    .title{font-size:30px;font-weight:750;fill:#172033}.subtitle{font-size:14px;fill:#64748b}
    .room{font-size:18px;font-weight:750;fill:#334155;text-anchor:middle}.roomsub{font-size:12px;fill:#64748b;text-anchor:middle}
    .note{font-size:14px;fill:#334155}.small{font-size:12px;fill:#526175}.micro{font-size:10px;fill:#64748b}
    .panel{fill:#fff;stroke:#d6dae1;stroke-width:1.5}.fixed{fill:#fffdf8;stroke:#64748b;stroke-width:2}
    .planned{fill:#fff7ed;stroke:#f97316;stroke-width:2;stroke-dasharray:7 5}
    .water{fill:none;stroke:#0284c7;stroke-width:4}.hot{fill:none;stroke:#dc2626;stroke-width:4}
    .drain{fill:none;stroke:#0f766e;stroke-width:5}.gas{fill:none;stroke:#ea580c;stroke-width:4}
    .power{fill:none;stroke:#2563eb;stroke-width:3}.network{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:7 5}
    .danger{fill:#fff1f2;stroke:#dc2626;stroke-width:2}.cat{fill:none;stroke:#16a34a;stroke-width:6;stroke-dasharray:8 5}
    .dim{fill:none;stroke:#64748b;stroke-width:1.5}.dimtext{font-size:12px;fill:#475569;text-anchor:middle}
    .center{text-anchor:middle}.bold{font-weight:700}.orange{fill:#c2410c}.red{fill:#b91c1c}.blue{fill:#1d4ed8}.green{fill:#15803d}.purple{fill:#6d28d9}
  </style>
</defs>

<rect width="1400" height="850" fill="#fbfaf7"/>
<text x="70" y="52" class="title">23 电气｜客厅节点与点位图</text>
<text x="70" y="78" class="subtitle">客厅明装电气节点、末端点位与照明控制；讨论图</text>

<rect x="55" y="112" width="760" height="570" rx="14" class="panel"/>
<text x="80" y="150" class="note bold">客厅路线与中文节点</text>
<text x="80" y="177" class="small blue">回路：RCBO-03生活路 + MCB-04空调冰箱专路；两路不得混接｜路线：客01先北，再沿未来隔帘线向西到客02；客03沿南侧最短墙边</text>
<path d="M95 205H65V160" class="power"/><text x="80" y="202" class="micro blue">来自副保护盒</text>
<rect x="95" y="187" width="310" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="115" y="212" class="note bold">客01 入口生活节点（L1）</text><text x="115" y="235" class="small">客02主干 / 洗烘/小厨电 / 客厅双开</text><path d="M250 253V305" class="power" marker-end="url(#blue-arrow)"/><rect x="95" y="305" width="310" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="115" y="330" class="note bold">客02 西侧生活节点（W1）</text><text x="115" y="353" class="small">投影 / 沙发/扫地机 / 书桌</text><path d="M250 371V423" class="power" marker-end="url(#blue-arrow)"/><rect x="95" y="423" width="310" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="115" y="448" class="note bold">客03 空调冰箱节点（A1）</text><text x="115" y="471" class="small">客厅空调 / 冰箱</text>
<text x="90" y="567" class="small bold">照明 / 控制</text><text x="110" y="590" class="small">• 双开第1键→客厅主灯；第2键→餐区双头射灯</text><text x="110" y="613" class="small">• 沙发背景灯插常电；不得切断扫地机或其他通用插座</text>
<rect x="840" y="112" width="505" height="570" rx="14" class="panel"/>
<text x="865" y="150" class="note bold">末端点位表｜位置/标高均TBD</text>
<rect x="850" y="160" width="455" height="38" rx="6" class="planned"/><text x="868" y="185" class="small">01｜洗烘一体机｜建议点位·未施工</text><rect x="850" y="206" width="455" height="38" rx="6" class="planned"/><text x="868" y="231" class="small">02｜洗烘旁小厨电×2｜建议点位·未施工</text><rect x="850" y="252" width="455" height="38" rx="6" class="planned"/><text x="868" y="277" class="small">03｜书桌下常电｜建议点位·未施工</text><rect x="850" y="298" width="455" height="38" rx="6" class="planned"/><text x="868" y="323" class="small">04｜书桌上常电｜建议点位·未施工</text><rect x="850" y="344" width="455" height="38" rx="6" class="planned"/><text x="868" y="369" class="small">05｜投影仪｜建议点位·未施工</text><rect x="850" y="390" width="455" height="38" rx="6" class="planned"/><text x="868" y="415" class="small">06｜沙发上部充电｜建议点位·未施工</text><rect x="850" y="436" width="455" height="38" rx="6" class="planned"/><text x="868" y="461" class="small">07｜扫地机低位常电｜建议点位·未施工</text><rect x="850" y="482" width="455" height="38" rx="6" class="planned"/><text x="868" y="507" class="small">08｜客厅空调末端漏保｜建议点位·未施工</text><rect x="850" y="528" width="455" height="38" rx="6" class="planned"/><text x="868" y="553" class="small">09｜冰箱末端漏保｜建议点位·未施工</text><rect x="850" y="574" width="455" height="38" rx="6" class="planned"/><text x="868" y="599" class="small">10｜客厅双开暗盒（非插座）｜建议点位·未施工</text>
<text x="865" y="655" class="micro">虚线橙框=建议点位；现场用卷尺放样、拍照、填标高后才转施工图。</text>
<rect x="55" y="696" width="1290" height="72" rx="10" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
<text x="80" y="718" class="small red">• 客01→客02路线/标高、隔帘关系仍待现场弹线；智能双开现场0只，1月重购。</text><text x="80" y="742" class="small red">• 空调和冰箱须各用≤30mA、L/N双极切断、带TEST/RESET的末端漏保；铭牌待核。</text>

<text x="100" y="800" class="small">当前讨论图｜北↑ 东→｜墙线仍为名义示意；9/28新尺寸优先，关联墙线待复测。非施工放样或验收图。</text>
</svg>
