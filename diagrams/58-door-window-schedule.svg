<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" data-diagram-role="door-window-schedule" role="img">
<title>58 木作｜门窗尺寸表</title>
<desc>门洞、窗扇与五扇防猫纱窗的尺寸、映射和当前状态</desc>

<defs>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="12" height="12" fill="#f1f5f9"/><line y2="12" stroke="#cbd5e1" stroke-width="4"/>
  </pattern>
  <pattern id="danger" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#fff1f2"/><line y2="10" stroke="#fecaca" stroke-width="3"/>
  </pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#334155"/></marker>
  <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#2563eb"/></marker>
  <style>
    text{font-family:"Source Han Sans SC","Heiti SC","Arial Unicode MS",sans-serif}
    .wall{fill:none;stroke:#1f2937;stroke-width:7;stroke-linecap:square;stroke-linejoin:miter}
    .iw{fill:none;stroke:#475569;stroke-width:5;stroke-linecap:square}
    .win{stroke:#0284c7;stroke-width:8}.winc{stroke:#e0f2fe;stroke-width:2.5}
    .title{font-size:30px;font-weight:750;fill:#172033}.subtitle{font-size:14px;fill:#64748b}
    .room{font-size:18px;font-weight:750;fill:#334155;text-anchor:middle}.roomsub{font-size:12px;fill:#64748b;text-anchor:middle}
    .note{font-size:14px;fill:#334155}.small{font-size:12px;fill:#526175}.micro{font-size:10px;fill:#64748b}
    .panel{fill:#fff;stroke:#d6dae1;stroke-width:1.5}.fixed{fill:#fffdf8;stroke:#64748b;stroke-width:2}
    .planned{fill:#fff7ed;stroke:#f97316;stroke-width:2;stroke-dasharray:7 5}
    .water{fill:none;stroke:#0284c7;stroke-width:4}.hot{fill:none;stroke:#dc2626;stroke-width:4}
    .drain{fill:none;stroke:#0f766e;stroke-width:5}.gas{fill:none;stroke:#ea580c;stroke-width:4}
    .power{fill:none;stroke:#2563eb;stroke-width:3}.network{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:7 5}
    .danger{fill:#fff1f2;stroke:#dc2626;stroke-width:2}.cat{fill:none;stroke:#16a34a;stroke-width:6;stroke-dasharray:8 5}
    .dim{fill:none;stroke:#64748b;stroke-width:1.5}.dimtext{font-size:12px;fill:#475569;text-anchor:middle}
    .center{text-anchor:middle}.bold{font-weight:700}.orange{fill:#c2410c}.red{fill:#b91c1c}.blue{fill:#1d4ed8}.green{fill:#15803d}.purple{fill:#6d28d9}
  </style>
</defs>

<rect width="1400" height="850" fill="#fbfaf7"/>
<text x="70" y="52" class="title">58 木作｜门窗尺寸表</text>
<text x="70" y="78" class="subtitle">门洞、窗扇与五扇防猫纱窗的尺寸、映射和当前状态</text>
<rect x="70" y="115" width="1260" height="585" rx="14" class="panel"/><rect x="90" y="140" width="1220" height="46" fill="#f1f5f9"/><text x="110" y="170" class="note bold">类别</text><text x="240" y="170" class="note bold">对象</text><text x="520" y="170" class="note bold">已知尺寸</text><text x="790" y="170" class="note bold">状态与边界</text><line x1="90" y1="204" x2="1310" y2="204" stroke="#e2e8f0"/><text x="110" y="244" class="note">门</text><text x="240" y="244" class="note">厨房门洞</text><text x="520" y="244" class="note">74×195cm</text><text x="790" y="244" class="note">已实测；门扇/轨道未定制</text><line x1="90" y1="262" x2="1310" y2="262" stroke="#e2e8f0"/><text x="110" y="302" class="note">门</text><text x="240" y="302" class="note">卫生间门洞</text><text x="520" y="302" class="note">67×198cm</text><text x="790" y="302" class="note">已实测；有效净宽TBD</text><line x1="90" y1="320" x2="1310" y2="320" stroke="#e2e8f0"/><text x="110" y="360" class="note">门</text><text x="240" y="360" class="note">卧室门</text><text x="520" y="360" class="note">洞口名义80cm</text><text x="790" y="360" class="note">旧门已拆；新门未购买</text><line x1="90" y1="378" x2="1310" y2="378" stroke="#e2e8f0"/><text x="110" y="418" class="note">窗</text><text x="240" y="418" class="note">客厅纱窗</text><text x="520" y="418" class="note">95×47cm×1</text><text x="790" y="418" class="note">已定做；安装验收待核</text><line x1="90" y1="436" x2="1310" y2="436" stroke="#e2e8f0"/><text x="110" y="476" class="note">窗</text><text x="240" y="476" class="note">卧室纱窗</text><text x="520" y="476" class="note">95×47cm×1</text><text x="790" y="476" class="note">已定做；安装验收待核</text><line x1="90" y1="494" x2="1310" y2="494" stroke="#e2e8f0"/><text x="110" y="534" class="note">窗</text><text x="240" y="534" class="note">阳台西窗</text><text x="520" y="534" class="note">90×47cm×1</text><text x="790" y="534" class="note">已定做；活动区对应待验收</text><line x1="90" y1="552" x2="1310" y2="552" stroke="#e2e8f0"/><text x="110" y="592" class="note">窗</text><text x="240" y="592" class="note">阳台南窗</text><text x="520" y="592" class="note">128×74cm×2</text><text x="790" y="592" class="note">已定做；两扇映射待验收</text><line x1="90" y1="610" x2="1310" y2="610" stroke="#e2e8f0"/><text x="110" y="650" class="note">窗</text><text x="240" y="650" class="note">厨房外窗</text><text x="520" y="650" class="note">精确洞口TBD</text><text x="790" y="650" class="note">固定封闭、无纱窗；排烟孔已封严</text><text x="90" y="735" class="note red">纱窗尺寸是成品尺寸，不得乘二或反推为整窗洞口；五扇总价500元已付清，但安装和防猫验收仍待确认。</text>
<text x="100" y="800" class="small">当前讨论图｜北↑ 东→｜墙线仍为名义示意；9/28新尺寸优先，关联墙线待复测。非施工放样或验收图。</text>
</svg>
