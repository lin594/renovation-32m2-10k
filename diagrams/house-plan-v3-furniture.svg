<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">32平方米旧房家具与功能布置图 v3</title>
  <desc id="desc">表示客厅、厨房、卧室和阳台的家具新布局、待定角落、瓷砖增设台面和受潮木柜决策点。</desc>
  <defs>
    <pattern id="tile" width="60" height="40" patternUnits="userSpaceOnUse"><rect width="60" height="40" fill="#fff7ed"/><path d="M60 0H0V40" fill="none" stroke="#f59e0b" stroke-width="2"/></pattern>
    <pattern id="public" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f1f5f9"/><line y2="12" stroke="#cbd5e1" stroke-width="4"/></pattern>
    <style>
      text{font-family:"Source Han Sans SC","Heiti SC","Arial Unicode MS",sans-serif}.wall{fill:none;stroke:#1f2937;stroke-width:7;stroke-linecap:square}.iw{fill:none;stroke:#475569;stroke-width:5}.win{stroke:#0284c7;stroke-width:8}.winc{stroke:#e0f2fe;stroke-width:2.5}
      .f{fill:#fffdf8;stroke:#64748b;stroke-width:2}.fw{fill:#effafd;stroke:#16829a;stroke-width:2}.todo{fill:#fff7ed;stroke:#f97316;stroke-width:2;stroke-dasharray:7 5}.cat{fill:#ecfdf3;stroke:#4d8b45;stroke-width:2;stroke-dasharray:6 4}
      .label{font-size:13px;fill:#263449;text-anchor:middle;dominant-baseline:middle}.tiny{font-size:11.5px;fill:#526175}.note{font-size:15px;fill:#334155}.room{font-size:18px;font-weight:750;fill:#172033}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1400" height="850" fill="#fbfaf7"/>
  <text x="70" y="52" font-size="30" font-weight="750" fill="#172033">家具与功能布置 · v3</text>
  <text x="70" y="78" font-size="14" fill="#64748b">实线家具=已有/明确计划｜橙色虚线=尺寸或方案待定｜绿色虚线=猫咪功能</text>

  <!-- simplified room fields -->
  <rect x="100" y="130" width="300" height="400" fill="#f7ead7"/>
  <rect x="100" y="530" width="300" height="100" fill="#e6f3e8"/>
  <rect x="400" y="130" width="200" height="200" fill="#f9efd0"/>
  <rect x="400" y="330" width="100" height="120" fill="#dff3f7"/>
  <rect x="500" y="330" width="100" height="120" fill="#edf1f5"/>
  <rect x="400" y="450" width="200" height="80" fill="#edf1f5"/>
  <rect x="600" y="130" width="300" height="300" fill="#ece8f7"/>
  <rect x="600" y="430" width="300" height="100" fill="url(#public)"/>
  <path class="wall" d="M100 130H900V430H600V530H400V630H100Z"/>
  <path class="iw" d="M400 130V450M400 330H520M500 330V450M400 450H405M475 450H600M600 130V345M600 425V530M600 430H900M100 530H250"/>
  <!-- openings shown as clean gaps -->
  <path d="M400 450V530" stroke="#f7ead7" stroke-width="9"/><path d="M520 330H600" stroke="#edf1f5" stroke-width="9"/><path d="M405 450H475" stroke="#edf1f5" stroke-width="9"/><path d="M600 345V425" stroke="#ece8f7" stroke-width="9"/><path d="M600 450V530" stroke="#f1f5f9" stroke-width="9"/><path d="M250 530H400" stroke="#e6f3e8" stroke-width="9"/>
  <!-- windows -->
  <g><path class="win" d="M200 130H300M450 130H550M700 130H800M100 535V625M110 630H390M435 330H485"/><path class="winc" d="M200 130H300M450 130H550M700 130H800M100 535V625M110 630H390M435 330H485"/></g>

  <!-- living room -->
  <g>
    <text class="room" x="250" y="160" text-anchor="middle">客厅</text>
    <rect class="f" x="106" y="138" width="84" height="152" rx="9"/>
    <path d="M126 143V285M170 143V285" stroke="#c6a77d" stroke-width="2"/>
    <text class="label" x="148" y="214" transform="rotate(-90 148 214)">双人沙发</text>
    <!-- desk now fully against west wall, east edge y=1.3 -->
    <rect class="f" x="106" y="380" width="124" height="70" rx="4"/>
    <text class="label" x="168" y="410">书桌 1.3×0.7</text><text class="tiny" x="122" y="438">西侧贴墙；桌下留空</text>
    <circle cx="176" cy="356" r="19" fill="#fff" stroke="#64748b" stroke-width="2"/><text class="tiny" x="164" y="360">椅子</text>
    <!-- fridge shifted west so its east edge aligns with desk -->
    <rect class="f" x="160" y="460" width="70" height="70" rx="3"/>
    <text class="label" x="195" y="490">冰箱</text><text class="tiny" x="174" y="518">东侧=1.3m</text>
    <path d="M230 460A70 70 0 0 1 300 530M230 530H300" fill="none" stroke="#7c3aed" stroke-width="2" opacity=".7"/>
    <!-- resulting nook -->
    <rect class="todo" x="106" y="450" width="54" height="80" rx="6"/>
    <text class="label" x="133" y="483">角落</text><text class="tiny" x="114" y="502">功能待定</text><text class="tiny" x="108" y="519">椅子会挡</text>
    <path d="M160 445L179 376" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="fw" x="320" y="370" width="80" height="80" rx="4"/>
    <circle cx="360" cy="414" r="24" fill="none" stroke="#16829a" stroke-width="2"/><text class="label" x="360" y="391">洗烘一体机</text>
    <rect class="f" x="320" y="290" width="80" height="80" rx="4"/>
    <text class="label" x="360" y="325">餐桌</text><text class="tiny" x="341" y="351">0.8×0.8</text>
    <rect x="392" y="165" width="7" height="140" fill="#fff" stroke="#334155" stroke-width="2"/><text class="tiny" x="385" y="225" text-anchor="end">投影幕墙</text>
  </g>

  <!-- kitchen -->
  <g>
    <text class="room" x="500" y="158" text-anchor="middle">厨房</text>
    <!-- latest verbal dimension takes precedence: current counter about 0.5m deep -->
    <rect class="f" x="405" y="137" width="190" height="50" rx="3"/>
    <text class="label" x="500" y="163">现有台面 约0.5×2.0m</text>
    <rect x="405" y="137" width="180" height="40" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text class="tiny" x="409" y="128">拟增上层台面：平面投影与现有台面重合</text>
    <rect x="520" y="140" width="72" height="34" rx="3" fill="#fee2e2" stroke="#b45309" stroke-width="2"/><circle cx="540" cy="156" r="8" fill="none" stroke="#b45309"/><circle cx="570" cy="156" r="8" fill="none" stroke="#b45309"/><text class="tiny" x="548" y="132">灶台</text>
    <rect class="fw" x="405" y="252" width="40" height="74" rx="3"/><ellipse cx="425" cy="288" rx="13" ry="23" fill="none" stroke="#16829a" stroke-width="2"/><text class="tiny" x="410" y="318">水槽</text>
    <!-- between counter and sink: old cabinet / replacement decision -->
    <rect class="todo" x="405" y="188" width="40" height="62" rx="3"/>
    <line x1="405" y1="219" x2="445" y2="219" stroke="#f97316" stroke-width="2"/>
    <text class="tiny" x="452" y="211">现有二层木柜</text><text class="tiny" x="452" y="228">受潮；保留/更换待定</text>
  </g>

  <!-- upper kitchen worktop is a vertical layer; show it outside the plan as an unfolded elevation -->
  <g transform="translate(470 570)">
    <text x="90" y="-15" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">厨房上层台面展开示意（不表示新增占地）</text>
    <rect width="180" height="40" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
    <path d="M60 0V40M120 0V40" stroke="#9a3412" stroke-width="2"/>
    <text class="tiny" x="90" y="58" text-anchor="middle">60×40cm瓷砖 × 3｜伸缩杆支撑；承重、防倾倒、与灶台热源关系待核实</text>
  </g>

  <!-- wet-room fixtures simplified -->
  <g>
    <text x="450" y="352" font-size="14" font-weight="700" text-anchor="middle">卫生间</text>
    <rect class="fw" x="409" y="354" width="42" height="66" rx="16"/><text class="tiny" x="416" y="414">马桶</text>
    <path d="M405 395H462V445H405" fill="#d8f2f6" fill-opacity=".6" stroke="#16829a" stroke-width="2" stroke-dasharray="5 4"/><text class="tiny" x="420" y="438">淋浴</text>
    <rect class="fw" x="472" y="413" width="28" height="37"/><text x="486" y="429" font-size="9" text-anchor="middle">小浴柜</text>
  </g>

  <!-- bedroom -->
  <g>
    <text class="room" x="750" y="158" text-anchor="middle">卧室</text>
    <rect class="f" x="606" y="137" width="194" height="123" rx="6"/>
    <rect x="612" y="142" width="47" height="113" rx="7" fill="#f7f0e7" stroke="#c7b39a"/>
    <text class="label" x="724" y="196">双人床 1.3×2.0</text><text class="tiny" x="614" y="275">床头向西</text>
    <!-- 0.8m deep open wardrobe with curtain -->
    <rect x="820" y="137" width="74" height="287" rx="3" fill="#e4dfef" stroke="#665c7a" stroke-width="2"/>
    <path d="M820 140q10 8 20 0t20 0t20 0t14 0V422" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <text class="label" x="857" y="330" transform="rotate(-90 857 330)">衣柜深约0.8m｜帘子柜门</text>
    <rect x="820" y="137" width="74" height="123" fill="#ef4444" fill-opacity=".10" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text class="tiny" x="828" y="207">北段仍被床挡</text>
    <!-- long narrow cabinet/desk south of bed, parallel to it, west end against wall -->
    <rect class="todo" x="606" y="267" width="194" height="40" rx="3"/>
    <text class="label" x="703" y="286">长窄柜：床头柜 + 书桌（尺寸待定）</text>
    <circle cx="735" cy="330" r="18" fill="#fff" stroke="#f97316" stroke-width="2"/><text class="tiny" x="722" y="334">座椅</text>
  </g>

  <!-- balcony functions -->
  <g>
    <path d="M114 548H342" stroke="#15803d" stroke-width="3" stroke-dasharray="10 6"/><path d="M130 548V568M326 548V568" stroke="#15803d" stroke-width="2"/>
    <path d="M130 585H330" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 5"/><path d="M145 568V595M315 568V595" stroke="#dc2626" stroke-width="2"/>
    <text class="tiny" x="228" y="575" text-anchor="middle">靠客厅：可升降</text><text class="tiny" x="228" y="604" text-anchor="middle" fill="#b91c1c">另一条：已坏，不能升降</text>
    <rect class="f" x="350" y="536" width="44" height="88"/><text class="label" x="372" y="580" transform="rotate(-90 372 580)">阳台收纳柜</text>
    <path class="cat" d="M106 542V622M112 624H388" fill="none" stroke-width="8"/>
    <text class="tiny" x="111" y="650">西墙 + 南墙窗下：计划贴猫抓板</text>
  </g>

  <!-- side panel -->
  <g transform="translate(980 120)">
    <rect width="360" height="545" rx="14" fill="#fff" stroke="#d6dae1" stroke-width="1.5"/>
    <text x="24" y="40" font-size="21" font-weight="750" fill="#172033">本轮布局变化</text>
    <text class="note" x="24" y="78">① 书桌西侧完全贴墙，东缘约y=1.3m；</text>
    <text class="note" x="43" y="103">冰箱同步西移，使两者东侧平齐。</text>
    <text class="note" x="24" y="139">② 形成约0.6×0.8m角落，但桌下虽空，</text>
    <text class="note" x="43" y="164">日常会被椅子挡住，暂不定义功能。</text>
    <text class="note" x="24" y="200">③ 洗衣机更新为洗烘一体滚筒机；</text>
    <text class="note" x="43" y="225">阳台两条晾衣架一条可用、一条损坏。</text>
    <text class="note" x="24" y="261">④ 厨房拟用伸缩杆+三块60×40cm瓷砖</text>
    <text class="note" x="43" y="286">做架空上层台面；中间木柜是否更换待定。</text>
    <text class="note" x="24" y="322">⑤ 卧室衣柜深约0.8m，以帘子代柜门；</text>
    <text class="note" x="43" y="347">床南侧增加长窄柜，兼床头柜和书桌。</text>
    <line x1="24" y1="382" x2="336" y2="382" stroke="#e2e8f0"/>
    <text x="24" y="417" font-size="16" font-weight="700" fill="#b45309">图上发现的待核实点</text>
    <text class="note" x="24" y="449">• 原台面最新尺寸约0.5×2.0m，仍需复测</text>
    <text class="note" x="24" y="478">• 卧室长窄柜未给具体长、宽、高</text>
    <text class="note" x="24" y="507">• 伸缩杆台面的承重与防倾倒尚未确定</text>
  </g>
  <text x="100" y="690" font-size="13" fill="#64748b">说明：本图用于讨论家具关系。虚线项目均不应据图下料；瓷砖台面、窄长柜和受潮木柜需实测后再定。</text>
</svg>
