<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" data-diagram-role="lighting-circuits" role="img">
<title>31 五回路与无主灯分区图</title>
<desc>按四个穿线孔表达三条设备回路、两条照明回路和玄关家庭中枢</desc>

<defs>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="12" height="12" fill="#f1f5f9"/><line y2="12" stroke="#cbd5e1" stroke-width="4"/>
  </pattern>
  <pattern id="danger" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#fff1f2"/><line y2="10" stroke="#fecaca" stroke-width="3"/>
  </pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#334155"/></marker>
  <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#2563eb"/></marker>
  <style>
    text{font-family:"Source Han Sans SC","Heiti SC","Arial Unicode MS",sans-serif}
    .wall{fill:none;stroke:#1f2937;stroke-width:7;stroke-linecap:square;stroke-linejoin:miter}
    .iw{fill:none;stroke:#475569;stroke-width:5;stroke-linecap:square}
    .win{stroke:#0284c7;stroke-width:8}.winc{stroke:#e0f2fe;stroke-width:2.5}
    .title{font-size:30px;font-weight:750;fill:#172033}.subtitle{font-size:14px;fill:#64748b}
    .room{font-size:18px;font-weight:750;fill:#334155;text-anchor:middle}.roomsub{font-size:12px;fill:#64748b;text-anchor:middle}
    .note{font-size:14px;fill:#334155}.small{font-size:12px;fill:#526175}.micro{font-size:10px;fill:#64748b}
    .panel{fill:#fff;stroke:#d6dae1;stroke-width:1.5}.fixed{fill:#fffdf8;stroke:#64748b;stroke-width:2}
    .planned{fill:#fff7ed;stroke:#f97316;stroke-width:2;stroke-dasharray:7 5}
    .water{fill:none;stroke:#0284c7;stroke-width:4}.hot{fill:none;stroke:#dc2626;stroke-width:4}
    .drain{fill:none;stroke:#0f766e;stroke-width:5}.gas{fill:none;stroke:#ea580c;stroke-width:4}
    .power{fill:none;stroke:#2563eb;stroke-width:3}.network{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:7 5}
    .danger{fill:#fff1f2;stroke:#dc2626;stroke-width:2}.cat{fill:none;stroke:#16a34a;stroke-width:6;stroke-dasharray:8 5}
    .dim{fill:none;stroke:#64748b;stroke-width:1.5}.dimtext{font-size:12px;fill:#475569;text-anchor:middle}
    .center{text-anchor:middle}.bold{font-weight:700}.orange{fill:#c2410c}.red{fill:#b91c1c}.blue{fill:#1d4ed8}.green{fill:#15803d}.purple{fill:#6d28d9}
  </style>
</defs>

<rect width="1400" height="850" fill="#fbfaf7"/>
<text x="70" y="52" class="title">31 五回路与无主灯分区图</text>
<text x="70" y="78" class="subtitle">按四个穿线孔表达三条设备回路、两条照明回路和玄关家庭中枢</text>

<rect x="100" y="130" width="300" height="400" fill="#f7ead7" opacity="0.68"/>
<rect x="100" y="530" width="300" height="100" fill="#e6f3e8" opacity="0.68"/>
<rect x="400" y="130" width="200" height="200" fill="#f9efd0" opacity="0.68"/>
<rect x="400" y="330" width="100" height="120" fill="#dff3f7" opacity="0.68"/>
<rect x="500" y="330" width="100" height="120" fill="#edf1f5" opacity="0.68"/>
<rect x="400" y="450" width="200" height="80" fill="#edf1f5" opacity="0.68"/>
<rect x="600" y="130" width="300" height="300" fill="#ece8f7" opacity="0.68"/>
<rect x="600" y="430" width="300" height="100" fill="url(#hatch)"/>

<path class="wall" d="M100 130H900V430H600V530H400V630H100Z"/>
<path class="iw" d="M400 130V450M400 330H520M500 330V450M400 450H405M475 450H500M600 130V345M600 425V530M600 430H900M100 530H250"/>
<g data-connection="hall-a-b-open"><!-- 走廊A与走廊B在x=3.2、y[4,5]处无隔墙并连续连通 --></g>
<path d="M400 450V530" stroke="#f7ead7" stroke-width="10"/>
<path d="M520 330H600" stroke="#edf1f5" stroke-width="10"/>
<path d="M405 450H475" stroke="#edf1f5" stroke-width="10"/>
<path d="M600 345V425" stroke="#ece8f7" stroke-width="10"/>
<path d="M600 450V530" stroke="#f1f5f9" stroke-width="10"/>
<path d="M250 530H400" stroke="#e6f3e8" stroke-width="10"/>
<path class="win" d="M200 130H300M450 130H550M700 130H800M100 535V625M110 630H390M435 330H485"/><path class="winc" d="M200 130H300M450 130H550M700 130H800M100 535V625M110 630H390M435 330H485"/>
<g data-circuit="RCBO-01" fill="none" stroke="#0284c7" stroke-width="5">
  <path d="M590 442L600 345L690 345"/>
</g><text x="700" y="326" class="micro blue">漏保1｜卧室插座/空调</text>
<g data-circuit="RCBO-02" fill="none" stroke="#16a34a" stroke-width="5">
  <path d="M590 442L520 330V265"/>
</g><text x="530" y="285" class="micro green">漏保2｜厨房插座/设备</text>
<g data-circuit="RCBO-03" fill="none" stroke="#dc2626" stroke-width="5">
  <path d="M590 442H475M475 442V400M475 442H400V330"/>
  <path d="M555 442V500" stroke-width="3"/>
</g><text x="225" y="315" class="micro red center">漏保3｜客厅插座/空调/洗烘</text><text x="450" y="420" class="micro red center">卫生间全部用电</text>
<rect x="525" y="493" width="60" height="24" rx="4" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/><text x="555" y="508" class="micro red center">设备架常电</text>

<g data-circuit="MCB-01" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 5">
  <path d="M600 447V345H750V255"/>
  <path d="M600 447L520 335V220"/>
</g>
<circle cx="750" cy="245" r="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><text x="750" y="249" class="small center orange">灯</text>
<circle cx="520" cy="210" r="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><text x="520" y="214" class="small center orange">灯</text>
<text x="700" y="390" class="micro orange center">空开4｜北向照明｜孔01/02</text>

<g data-circuit="MCB-02" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="9 5">
  <path d="M585 447H520V475"/>
  <path d="M520 447H400V280"/>
  <path d="M400 447H250V570"/>
</g>
<circle cx="520" cy="485" r="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="520" y="489" class="small center purple">带</text>
<circle cx="250" cy="280" r="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="250" y="284" class="small center purple">灯</text>
<circle cx="250" cy="580" r="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="250" y="584" class="small center purple">灯</text>
<text x="285" y="480" class="micro purple center">空开5｜走廊/客厅/阳台照明｜孔04</text>

<rect x="575" y="430" width="44" height="25" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="624" y="426" class="small blue">配电箱｜3漏保+2空开</text>
<circle cx="600" cy="345" r="10" fill="#fff" stroke="#334155" stroke-width="2"/><text x="600" y="349" class="micro center">01</text>
<circle cx="520" cy="330" r="10" fill="#fff" stroke="#334155" stroke-width="2"/><text x="520" y="334" class="micro center">02</text>
<circle cx="475" cy="450" r="10" fill="#fff" stroke="#334155" stroke-width="2"/><text x="475" y="454" class="micro center">03</text>
<circle cx="400" cy="450" r="10" fill="#fff" stroke="#334155" stroke-width="2"/><text x="400" y="454" class="micro center">04</text>

<text x="220" y="210" class="room">客厅</text><text x="470" y="180" class="room">厨房</text>
<text x="450" y="375" class="small center bold">卫生间</text><text x="790" y="205" class="room">卧室</text>
<text x="550" y="385" class="small center bold">走廊B</text><text x="545" y="485" class="small center bold">走廊A</text>
<text x="250" y="610" class="room">转角阳台</text>
<rect x="970" y="120" width="370" height="560" rx="14" class="panel"/><text x="994" y="160" class="note bold">五回路初步方案｜路径优先</text><text x="994" y="196" class="note">漏保1：卧室插座/空调 → 孔01</text><text x="994" y="225" class="note">漏保2：厨房插座/设备 → 孔02</text><text x="994" y="254" class="note">漏保3：客厅+卫生间+设备架 → 孔03/04</text><text x="994" y="283" class="note">洗烘机在客厅，归漏保3</text><text x="994" y="312" class="note">空开4：卧室+厨房固定照明（北向）</text><text x="994" y="341" class="note">空开5：走廊+客厅+阳台照明（南向）</text><text x="994" y="370" class="note">卫生间灯仍归漏保3，不接空开</text><text x="994" y="399" class="note">220V灯带归空开5；使用专用电源接头</text><text x="994" y="428" class="note">灯光分区靠下游开关，不增加配电箱回路</text><text x="994" y="457" class="note red">若空开确为36A，不得直接保护1.5mm²</text><text x="994" y="486" class="note red">本图为讨论图；10月1日按铭牌和负载冻结</text><line x1="994" y1="507" x2="1316" y2="507" stroke="#e2e8f0"/><line x1="998" y1="525" x2="1030" y2="525" stroke="#0284c7" stroke-width="5"/><text x="1044" y="529" class="small">漏保1</text><line x1="998" y1="554" x2="1030" y2="554" stroke="#16a34a" stroke-width="5"/><text x="1044" y="558" class="small">漏保2</text><line x1="998" y1="583" x2="1030" y2="583" stroke="#dc2626" stroke-width="5"/><text x="1044" y="587" class="small">漏保3</text><line x1="998" y1="612" x2="1030" y2="612" stroke="#f59e0b" stroke-width="5"/><text x="1044" y="616" class="small">空开4</text><line x1="998" y1="641" x2="1030" y2="641" stroke="#7c3aed" stroke-width="5"/><text x="1044" y="645" class="small">空开5</text>
<text x="100" y="800" class="small">V4 讨论图｜北↑ 东→｜坐标和尺寸以 house.yaml 与现场复测为准，不替代施工放样或专项验收。</text>
</svg>
