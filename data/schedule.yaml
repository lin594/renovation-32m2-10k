strategy:
  name: "10月主攻、1月单人收尾、10月后零装修专项往返"
  objective: "在10000元总预算内，利用唯一双人窗口完成高判断、高耦合工作，并在2027年1月完成三猫安全入住"
  constraints:
    - "2026-10-01至2026-10-08为唯一双人且主负责人全程在场的施工窗口"
    - "2026-10-08离场后至2027年1月中旬不安排北京—开封装修专项往返"
    - "2027年1月中旬仅一名非主负责人DIY，且只执行已经定型、编号和示范的工作"
    - "1月返回属于连续驻留，不计为装修专项往返"
    - "每次北京—开封装修往返约700元"

milestones:
  - id: MS-SEP-PREP
    name: "远程备料和预约完成"
    target_date: "2026-09-30"
    owner: 主负责人
    acceptance:
      - "乳胶漆按3桶底漆、5桶面漆、1套工具完成下单或具备到货确认"
      - "BVVB 2×2.5mm²首卷50m已下单或到货；PCT-42×1、PCT-62×6及6只独立检修盒进入购物车"
      - "1.5mm²照明线保持购物车状态；保护器与PCT是否可安装明确标注为10月1日现场门禁"
      - "已预约合格电工在10月1日复核供电/PE系统和方案，并在新建线路通电前完成规定检测"
      - "EVE V完成72小时运行、断电恢复、虚拟机自启和远程管理验证"
      - "走廊A 220V灯带候选产品已核对成套电源接头、剪切单位和末端封帽"
      - "门窗商已预约10月1日复测并预留1月安装档期"
  - id: MS-OCT-CLOSE
    name: "双人主施工窗口结束"
    target_date: "2026-10-08"
    owner: 主负责人
    acceptance:
      - "卫生间湿作业、全屋基层和乳胶漆施工已完成；木器漆/瓷砖漆已按小样结论完成或放弃"
      - "4扇旧铁门已回收，称重/议价证据和收入已录入账本"
      - "明线和地板已尽量完成；剩余部分已有首段示范、端点编号及视频说明"
  - id: MS-CAT-IDEAL
    name: "三猫理想入住"
    target_date: "2027-01-15"
    owner: 一月现场执行者
  - id: MS-CAT-HARD
    name: "三猫入住硬截止"
    target_date: "2027-02-07"
    owner: 业主

