october_daily_plan:
  - date: "2026-10-01"
    focus: "清场、回收、复测、排水测试和小样"
    both_workers:
      - "回收4扇旧铁门，记录重量、单价、总价和收款"
      - "盘点库存、临时电源与工具"
      - "门窗商复测三扇门和全部防猫纱窗，冻结报价和1月安装方案"
      - "复测地面、窗洞、门槛和石塑地板面积"
      - "对厨房水槽做满水及连续排水测试并修复渗漏"
      - "完成桌底10×10cm木器漆小样和厨卫瓷砖漆隐蔽小样"
      - "购买重物并按房间分区堆放"
      - "拍摄5个支路保护器及上级器件正面/侧面铭牌，记录额定值、极数、漏电动作参数和分断能力"
      - "按五回路上限复测路线与逐点拓扑，确认第4/5位只能为空开，冻结两条照明线、三条房间设备线、端子和分配块数量"
      - "复测BVVB 2×2.5mm²净路线：超过45m则京东补第二卷；否则使用首卷并保留约10%余量"
      - "两只照明空开为B10/C10且电工结合敷设/负载明确批准1.5mm²后，才购买两种1.5mm²线；否则执行插接式照明降级方案"
      - "逐节点核对PCT直接上级与最小下游导线：上级超过32A或不匹配导线/负载的节点均暂停"
      - "复测走廊A灯带长度、安装高度和接头检修位置"
  - date_range: ["2026-10-02", "2026-10-04"]
    focus: "卫生间湿作业与全屋基层双线并行"
    worker_a:
      - "修补地漏、管根、墙地交界及基层缺陷"
      - "严格按已核实产品说明完成防水各遍和固化等待"
      - "防水固化达到条件后安排不少于24h蓄水试验，记录水位、时间、节点和楼下/背水面情况"
      - "蓄水通过后才能排版、切割并准备铺设卫生间地砖；不通过则修复重测"
    worker_b:
      - "检查潮湿和基层牢固度，未处理水源处不得封闭"
      - "施工必要墙固/界面剂并分遍批腻子"
      - "在最终打磨前完成明线定位、固定点标记和必要预钻孔"
    waiting_tasks:
      - "检查木器漆和瓷砖漆小样附着"
      - "分类旧窗帘和罗马杆"
      - "试排石塑地板"
      - "按房间组装插座、开关和线槽材料包"
  - date: "2026-10-05"
    focus: "打磨、除尘、底漆和卫生间地砖"
    tasks:
      - "两人完成全屋腻子打磨、除尘和底漆"
      - "卫生间防水固化且不少于24h蓄水试验通过后铺完地砖；未通过则取消当天铺砖"
      - "木器漆与瓷砖漆小样附着合格才转入大面积；失败则保持原色/白砖"
  - date: "2026-10-06"
    focus: "第一遍面漆"
    tasks:
      - "完成全屋第一遍面漆"
      - "完成书桌与厨卫瓷砖漆第一遍"
      - "瓷砖胶达到产品要求后才美缝"
  - date: "2026-10-07"
    focus: "第二遍面漆和涂层收尾"
    tasks:
      - "完成全屋第二遍乳胶漆"
      - "按产品要求完成书桌和厨卫瓷砖漆后续遍数"
      - "当晚不在未干墙面安装线槽"
      - "剩余乳胶漆密封、编号并登记库存"
  - date: "2026-10-08"
    focus: "满足干燥条件时明线优先，随后推进地板"
    execution_gate: "墙面达到厂家允许安装和触碰的干燥状态"
    tasks:
      - "主负责人可在断电状态下完成线槽、明盒、编号和可逆预装；只有保护/PE方案已由电工确认时才进行端接"
      - "墙面允许安装时完成走廊A灯带；成套插头方案接智能插座，硬接方案仅在产品允许时进入可检修带盖接线盒"
      - "万用表和测电笔只做辅助通断/验电；新建固定线路须在合格电工完成绝缘、接线、接地故障条件及漏保动作等检测并留记录后才通电"
      - "依次铺卧室、客厅主区、走廊A/B、厨房和边角石塑地板"
      - "未完成部分必须冻结铺设方向、首排位置、切割示范、房间编号和视频说明"
      - "离场前关闭入户水和非必要电源，移除湿布、明火、刀片及开封化学品"
    fallback_if_paint_not_ready:
      - "不强装线槽，优先保护墙面"
      - "完成全部线路尺寸、端点编号和材料分包，留给1月按图执行"
    electrical_stop_rule: "PE系统、保护器/最小导线匹配或专业检测任一未关闭时，新建固定线路保持物理断开；不得以临时五孔插座测试代替验收"

main_leader_must_finish_or_freeze_in_october:
  - "完成卫生间防水、铺砖前不少于24h蓄水验证与湿作业；蓄水不通过则优先修复，不为赶铺砖跳过"
  - "完成全屋基层、底漆和两遍面漆；涂层小样不通过的项目在10月决定放弃"
  - "明线回路、走向、端点和材料包编号"
  - "石塑地板铺设方向、首排定位、房间编号和切割示范"
  - "三扇门及防猫纱窗的实测尺寸、报价、安装与验收清单"
  - "马桶350mm坑距、目标深度约580mm的选购清单"

between_october_and_january:
  - "不安排北京—开封装修专项往返，也不安排代理人涂装、铺地或电路施工"
  - "不把湿作业、基层处理、刷漆或现场方案判断留到1月"
  - "门窗商按10月尺寸生产并保管，约定1月中旬安装"
  - "小件存放在2km外另一住所，重物不配送到无人房屋"
  - "主负责人远程整理逐回路线图、地板编号、门窗验收和马桶购买清单"

january_single_worker_sequence:
  - order: 1
    item: "检查三个月后的墙面、桌面、瓷砖漆和漏水痕迹"
  - order: 2
    item: "接收商家安装三扇门与全部防猫纱窗并拍照验收"
  - order: 3
    item: "按10月示范完成剩余石塑地板、踢脚线和压条"
  - order: 4
    item: "若明线未完成，单人只可在断电状态下按编号图完成线槽/明盒等机械收尾；不得现场改变回路，也不得在专业门禁未关闭时端接或通电"
  - order: 5
    item: "购买350mm坑距马桶，优先选择含送货安装；已有淋浴设备继续使用"
  - order: 6
    item: "浴室柜、顶天立地衣柜架和洗烘机按预算门禁决定是否延期"
  - order: 7
    item: "深度保洁、移除化学品与碎料，执行三猫入住验收"

