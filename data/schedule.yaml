version: 1
updated: 2026-08-31
timezone: Asia/Shanghai
status: approved_execution_baseline

strategy:
  name: "10月主攻、1月单人收尾、10月后零装修专项往返"
  objective: "在10000元总预算内，利用唯一双人窗口完成高判断、高耦合工作，并在2027年1月完成三猫安全入住"
  constraints:
    - "2026-10-01至2026-10-08为唯一双人且主负责人全程在场的施工窗口"
    - "2026-10-08离场后至2027年1月中旬不安排北京—开封装修专项往返"
    - "2027年1月中旬仅一名非主负责人DIY，且只执行已经定型、编号和示范的工作"
    - "1月返回属于连续驻留，不计为装修专项往返"
    - "每次北京—开封装修往返约700元"

milestones:
  - id: MS-SEP-PREP
    name: "远程备料和预约完成"
    target_date: "2026-09-30"
    owner: 主负责人
    acceptance:
      - "乳胶漆按3桶底漆、5桶面漆、1套工具完成下单或具备到货确认"
      - "明线材料BOM按房间和端点编号"
      - "门窗商已预约10月1日复测并预留1月安装档期"
  - id: MS-OCT-CLOSE
    name: "双人主施工窗口结束"
    target_date: "2026-10-08"
    owner: 主负责人
    acceptance:
      - "卫生间湿作业、全屋基层和乳胶漆施工已完成；木器漆/瓷砖漆已按小样结论完成或放弃"
      - "4扇旧铁门已回收，称重/议价证据和收入已录入账本"
      - "明线和地板已尽量完成；剩余部分已有首段示范、端点编号及视频说明"
  - id: MS-CAT-IDEAL
    name: "三猫理想入住"
    target_date: "2027-01-15"
    owner: 一月现场执行者
  - id: MS-CAT-HARD
    name: "三猫入住硬截止"
    target_date: "2027-02-07"
    owner: 业主

onsite_windows:
  october_main:
    start: "2026-10-01"
    end: "2026-10-08"
    people: 2
    main_leader_present: true
    trip_cost_budget_cny: 700
    priority: "先安全和关键路径，再完成度；不得为赶工破坏涂层固化条件"
  no_special_trip:
    starts_after_departure: "2026-10-08"
    ends_on_january_return: "2027-01中旬"
    planned_renovation_roundtrips: 0
    proxy_construction_planned: false
  january_closeout:
    start: "2027-01中旬"
    end: "2027-02-07"
    people: 1
    main_leader_present: false
    stay_type: continuous_residence
    permitted_work: "仅执行10月已经冻结、编号、示范的重复性任务，接收商家安装并按清单验收"

september_remote_preparation:
  - id: SEP-01
    item: "购买底漆3桶、同色同批次面漆5桶和工具1套"
    planned_cost_cny: 2012
    requirements: ["确认生产日期", "确认储存温度", "确认施工温度", "确认重涂间隔", "未开封余漆登记库存"]
  - id: SEP-02
    item: "按明线图形成材料BOM并把小件寄到2km外另一住所"
    contents: ["线槽", "弯头", "三通", "底盒", "插座", "开关", "固定件", "线号与改色标识材料"]
  - id: SEP-03
    item: "木器漆、瓷砖漆及配套底涂仅买小样量"
  - id: SEP-04
    item: "核对卫生间地面防水产品准确型号、单位用量、成膜厚度、固化和贴砖兼容性"
  - id: SEP-05
    item: "预约门窗商10月1日复测和2027年1月中旬安装"
  - id: SEP-06
    item: "腻子、墙固、防水和石塑地板等重物只做比价，不配送到无人房屋"

october_daily_plan:
  - date: "2026-10-01"
    focus: "清场、回收、复测、排水测试和小样"
    both_workers:
      - "回收4扇旧铁门，记录重量、单价、总价和收款"
      - "盘点库存、临时电源与工具"
      - "门窗商复测三扇门和全部防猫纱窗，冻结报价和1月安装方案"
      - "复测地面、窗洞、门槛和石塑地板面积"
      - "对厨房水槽做满水及连续排水测试并修复渗漏"
      - "完成桌底10×10cm木器漆小样和厨卫瓷砖漆隐蔽小样"
      - "购买重物并按房间分区堆放"
  - date_range: ["2026-10-02", "2026-10-04"]
    focus: "卫生间湿作业与全屋基层双线并行"
    worker_a:
      - "修补地漏、管根、墙地交界及基层缺陷"
      - "严格按已核实产品说明完成防水各遍和固化等待"
      - "固化达到条件后排版、切割并铺设卫生间地砖"
    worker_b:
      - "检查潮湿和基层牢固度，未处理水源处不得封闭"
      - "施工必要墙固/界面剂并分遍批腻子"
      - "在最终打磨前完成明线定位、固定点标记和必要预钻孔"
    waiting_tasks:
      - "检查木器漆和瓷砖漆小样附着"
      - "分类旧窗帘和罗马杆"
      - "试排石塑地板"
      - "按房间组装插座、开关和线槽材料包"
  - date: "2026-10-05"
    focus: "打磨、除尘、底漆和卫生间地砖"
    tasks:
      - "两人完成全屋腻子打磨、除尘和底漆"
      - "卫生间防水达到固化条件后铺完地砖"
      - "木器漆与瓷砖漆小样附着合格才转入大面积；失败则保持原色/白砖"
  - date: "2026-10-06"
    focus: "第一遍面漆"
    tasks:
      - "完成全屋第一遍面漆"
      - "完成书桌与厨卫瓷砖漆第一遍"
      - "瓷砖胶达到产品要求后才美缝"
  - date: "2026-10-07"
    focus: "第二遍面漆和涂层收尾"
    tasks:
      - "完成全屋第二遍乳胶漆"
      - "按产品要求完成书桌和厨卫瓷砖漆后续遍数"
      - "当晚不在未干墙面安装线槽"
      - "剩余乳胶漆密封、编号并登记库存"
  - date: "2026-10-08"
    focus: "满足干燥条件时明线优先，随后推进地板"
    execution_gate: "墙面达到厂家允许安装和触碰的干燥状态"
    tasks:
      - "主负责人完成明装线槽、穿线、插座和开关安装"
      - "用万用表和测电笔完成能力范围内检查；无地线、绝缘电阻和漏保完整测试风险保持开放"
      - "依次铺卧室、客厅主区、走廊A/B、厨房和边角石塑地板"
      - "未完成部分必须冻结铺设方向、首排位置、切割示范、房间编号和视频说明"
      - "离场前关闭入户水和非必要电源，移除湿布、明火、刀片及开封化学品"
    fallback_if_paint_not_ready:
      - "不强装线槽，优先保护墙面"
      - "完成全部线路尺寸、端点编号和材料分包，留给1月按图执行"

main_leader_must_finish_or_freeze_in_october:
  - "完成卫生间防水与铺砖湿作业，并明确记录未做闭水验证"
  - "完成全屋基层、底漆和两遍面漆；涂层小样不通过的项目在10月决定放弃"
  - "明线回路、走向、端点和材料包编号"
  - "石塑地板铺设方向、首排定位、房间编号和切割示范"
  - "三扇门及防猫纱窗的实测尺寸、报价、安装与验收清单"
  - "马桶350mm坑距、目标深度约580mm的选购清单"

between_october_and_january:
  - "不安排北京—开封装修专项往返，也不安排代理人涂装、铺地或电路施工"
  - "不把湿作业、基层处理、刷漆或现场方案判断留到1月"
  - "门窗商按10月尺寸生产并保管，约定1月中旬安装"
  - "小件存放在2km外另一住所，重物不配送到无人房屋"
  - "主负责人远程整理逐回路线图、地板编号、门窗验收和马桶购买清单"

january_single_worker_sequence:
  - order: 1
    item: "检查三个月后的墙面、桌面、瓷砖漆和漏水痕迹"
  - order: 2
    item: "接收商家安装三扇门与全部防猫纱窗并拍照验收"
  - order: 3
    item: "按10月示范完成剩余石塑地板、踢脚线和压条"
  - order: 4
    item: "若明线未完成，仅按编号图安装，不改变回路和走向"
  - order: 5
    item: "购买350mm坑距马桶，优先选择含送货安装；已有淋浴设备继续使用"
  - order: 6
    item: "浴室柜、顶天立地衣柜架和洗烘机按预算门禁决定是否延期"
  - order: 7
    item: "深度保洁、移除化学品与碎料，执行三猫入住验收"

budget_gate:
  overall_budget_cny: 10000
  actual_expenses_after_tile_cny: 1860
  actual_income_cny: 55
  actual_net_outflow_cny: 1805
  october_trip_reserve_cny: 700
  paint_and_tools_plan_cny: 2012
  contingency_cny: 700
  available_for_other_work_cny: 4728
  formula: "10000 - 1860 - 700 - 2012 - 700 = 4728"
  defer_order:
    - "洗烘一体机"
    - "浴室柜"
    - "顶天立地衣柜架"
    - "阳台菠萝格与鹅卵石、沙发、宽带和非必要软装"
  non_reducible: ["防猫纱窗", "基本地面", "卫生间防水", "马桶", "基础用电"]

cat_move_in_gate:
  ideal_date: "2027-01-15"
  hard_deadline: "2027-02-07"
  fallback_residence_distance_km: 2
  fallback: "任一门槛未满足时，人和猫继续住另一套开封住所"
  acceptance:
    - "全部防猫纱窗已安装并通过锁扣、框体、纱网和防钻缝测试"
    - "所有地面铺设和收边完成"
    - "不再进行打磨、切割、刷漆、美缝等粉尘或刺激气味施工"
    - "乳胶漆、木器漆、瓷砖漆和美缝均超过厂家完全固化时间"
    - "明线、插座、线头、工具及化学品全部封闭"
    - "完成吸尘、湿拖和通风，现场无明显刺激性气味"

owner_decisions_and_open_risks:
  - decision: "卫生间地面防水由业主DIY，并选择跳过闭水试验"
    consequence: "只记录为防水已施工但未蓄水验证；不得标记验收合格，美缝不得视为防水层"
    risk_ref: SAF-0010
  - decision: "明线仅在乳胶漆达到允许安装条件后施工"
    consequence: "若10月8日涂层未干，线路设计和编号必须冻结，安装延至1月"
    risk_ref: SAF-0001
  - decision: "仅使用万用表和测电笔做DIY范围检查，暂不购买绝缘及漏保专用测试仪"
    consequence: "无地线、绝缘电阻和漏保完整测试风险保持开放，不得称为专业验收"
    risk_ref: SAF-0001

default_assumptions:
  - "门窗商能按10月实测尺寸生产并保管到2027年1月"
  - "一月现场执行者能够连续驻留至2月上旬"
  - "5桶面漆的连续施工保障优先于节省第5桶的299元"
