    - "完成吸尘、湿拖和通风，现场无明显刺激性气味"

owner_decisions_and_open_risks:
  - decision: "卫生间地面防水仍可由业主DIY，但第三方审计取消跳过闭水试验"
    consequence: "防水固化后、铺砖前至少完成不少于24h蓄水试验；不通过不得铺砖，美缝不得视为防水层"
    risk_ref: SAF-0010
  - decision: "明线仅在乳胶漆达到允许安装条件后施工"
    consequence: "若10月8日涂层未干，线路设计和编号必须冻结，安装延至1月"
    risk_ref: SAF-0001
  - decision: "仅使用万用表和测电笔做DIY范围检查，暂不购买绝缘及漏保专用测试仪"
    consequence: "DIY只做辅助检查；专业仪表由受聘电工提供，新建固定线路未取得实测记录不得通电或计入入住基础用电"
    risk_ref: SAF-0001
  - decision: "把合格电工复核和通电前检测纳入10月本地服务，不新增北京—开封往返"
    consequence: "可继续DIY低风险机械安装，但PE、保护器/线径/PCT结论和最终通电不由DIY判断"
    risk_ref: SAF-0018

default_assumptions:
  - "门窗商能按10月实测尺寸生产并保管到2027年1月"
  - "一月现场执行者能够连续驻留至2月上旬"
  - "5桶面漆的连续施工保障优先于节省第5桶的299元"
