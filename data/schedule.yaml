    requirements: ["确认生产日期", "确认储存温度", "确认施工温度", "确认重涂间隔", "未开封余漆登记库存"]
  - id: SEP-02
    item: "按五回路上限形成明线初步BOM并把不依赖现场参数的小件寄到2km外另一住所"
    contents: ["线槽", "弯头", "三通", "底盒", "插座", "开关", "固定件", "线号标识", "带盖接线盒"]
