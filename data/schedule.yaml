strategy:
  name: "9/28–10/4主攻、1月单人收尾、主窗口后零装修专项往返"
  objective: "在10000元总预算内，用9/28–10/4现场窗口完成高判断、高耦合工作，并在2027年1月完成三猫安全入住"
  constraints:
    - "2026-09-28至2026-10-04为当前主现场施工窗口"
    - "9/27夜出发，9/28约07:56抵达开封；9/28上午直接进入复测和电气安全复核"
    - "2026-10-04现场总验收、保洁、留档并保留返程缓冲，不再新开不可中断施工"
    - "主窗口结束后至2027年1月中旬不安排北京—开封装修专项往返"
    - "2027年1月中旬仅一名非主负责人DIY，且只执行已经定型、编号和示范的工作"
    - "业主恐高，不自行上屋顶或进行临边高处作业；顶楼疑似雨漏的迎水面维修交物业/防水人员"

milestones:
  - id: MS-SEP-PREP
    name: "远程备料和预约完成"
    target_date: "2026-09-27"
    owner: 主负责人
    acceptance:
      - "小建刷新S2颜色最终确认；按3桶底漆、4桶同色同批面漆和1套原厂工具完成下单或确认到货方案"
      - "已联系电工敲定9/28现场复核，并预留10/3明线完成后的终检"
      - "已预约9/28四扇旧铁门上门回收，优先由回收方负责从四楼搬下"
      - "最低工具包已补齐：5m卷尺、水平尺、万用表、伸缩滚筒杆、局部基层修补与基础电工手工具"
      - "门窗/防猫纱窗9/28现场复测路径明确；重物按9/28后直送或本地自提"
  - id: MS-MAIN-CLOSE
    name: "主现场施工窗口结束"
    target_date: "2026-10-04"
    owner: 主负责人
    acceptance:
      - "卫生间防水按产品要求固化并完成不少于24h蓄水试验；不通过则不铺砖"
      - "可施工区域完成局部基层、底漆和两遍面漆；持续受潮/雨漏区域允许明确跳过"
      - "明线回路、走向、端点编号和材料包已经完成或冻结；专业门禁未关闭的线路保持断开"
      - "石塑地板优先完成主要通行区；未完成部分已有首排示范、方向和编号"
      - "完成关键回路/漏保复查、渗漏状态确认、施工照片与尺寸留档、工具材料归位和垃圾清运"
  - id: MS-CAT-IDEAL
    name: "三猫理想入住"
    target_date: "2027-01-15"
    owner: 一月现场执行者
  - id: MS-CAT-HARD
    name: "三猫入住硬截止"
    target_date: "2027-02-07"
    owner: 业主

