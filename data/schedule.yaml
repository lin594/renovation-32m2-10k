remote_preparation_0926_0927:
  - id: PREP-01
    item: "乳胶漆定色与下单"
    details:
      - "S2 1875近可可蛋奶已作为墙面与天花板统一色；不拆白顶"
      - "当前面积口径：2.8m层高、阳台只刷顶、厨卫1.8m以下不刷；未扣三处主要外窗约123.99㎡"
      - "底漆3桶；面漆4桶仅在客服确认接近120㎡两遍覆盖口径后下单"
      - "刷漆工具直接用S2家约70元套装；另补伸缩接长杆"
  - id: PREP-02
    item: "预约旧铁门回收"
    details: ["4扇旧铁门", "老楼四楼、楼梯有转角平台", "要求回收方尽量负责搬下、现场称重、即时结算", "预约9/28上门"]
  - id: PREP-03
    item: "敲定电工"
    details: ["9/28上午方案复核", "10/3预留终检", "默认电工无工具上门，业主准备万用表与基础绝缘手工具", "绝缘电阻/漏保动作等专业检测另落实专用仪表"]
  - id: PREP-04
    item: "最低工具与搬运"
    details:
      - "购买5m卷尺、40–60cm水平尺、万用表、1.5–3m伸缩滚筒杆"
      - "不预购冲击钻、吸尘器、电动打磨机、电动爬楼机"
      - "四楼有转角平台；乳胶漆/小件可用六轮手动爬楼车分批搬，地板/腻子/马桶等要求商家送上楼或人工搬运"
  - id: PREP-05
    item: "电气与照明设计边界"
    details:
      - "五回路、两线制无PE、3漏保+2空开和卫生间专用馈线的逻辑继续有效"
      - "厨房双层台面灯带本轮不做；入住后如需要，优先低复杂度插接式任务灯/低压灯带"
      - "保护器型号、1.5mm²线、PCT实购、设备级漏保和卫生间连接方式必须等9/28现场参数"
  - id: PREP-06
    item: "三棵树S2防水下单与物流"
    details:
      - "产品锁定京东三棵树柔韧型S2灰色18kg、卫生间/厨房通用"
      - "18kg重货不寄2km外代收点；按开封京东常见时效于9/27下单直送装修房，目标9/28到，慢则9/29到"
      - "到货后按桶身/合格证确认液粉组分、配比、推荐厚度/遍数、复涂与贴砖前固化时间"
      - "不要一次把18kg全部混合；只有产品标签明确允许时才按比例分批配料"
  - id: PREP-07
    item: "顶楼疑似雨漏"
    details:
      - "业主不自行上屋顶"
      - "9/28室内铲除松动层、标记水迹和检查明确裂缝/孔点"
      - "只有明确点/缝时才考虑小规格堵漏材料做局部背水面处理；不整面刷普通厨卫防水当作根治"
      - "持续逢雨渗水时，屋面迎水面维修交物业/防水人员"

main_window_daily_plan:
  - date: "2026-09-28"
    focus: "复测、安全门禁、漏水排查和外部预约落地"
    tasks:
      - "到场盘点工具、材料和临时电源；四扇旧铁门按预约回收并记账"
      - "09:30全屋关键复测：门槛、涂刷净面积、厨房台面/燃气净空、设备铭牌"
      - "10:30左右由电工复核两线制无PE边界、配电箱铭牌、逐回路BOM和卫生间连接门禁"
      - "下午室内排查厨房水槽排水、客厅西/东墙受潮及西南角天花板疑似雨漏；业主不上屋顶"
      - "门窗与防猫纱窗集中复测；洗碗机柜体、进排水和开门净空复测"
      - "仅在现场参数齐全后补购保护器、1.5mm²线、PCT、漏保和其他C类物料"
  - date_range: ["2026-09-29", "2026-10-02"]
    focus: "卫生间湿作业与可施工墙面并行"
    tasks:
      - "卫生间基层节点处理、防水、按产品要求固化并安排不少于24h蓄水试验"
      - "墙面只做必要的局部腻子修补，不做装修公司级全屋厚找平"
      - "铲除松动/粉化层、除尘、局部打磨后推进底漆和面漆"
      - "漏源未关闭或仍潮湿的区域明确跳过，不用涂层强行封闭"
      - "等待时间用于试排石塑地板、分包装配插座/开关/线槽材料"
  - date_range: ["2026-10-02", "2026-10-03"]
    focus: "石塑地板主要区域"
    tasks:
      - "在基层和潮湿问题允许时完成主要通行区"
      - "与10/3电气终装冲突时，以电气终装和专业终检为先"
      - "未完成区域留下首排示范、铺设方向、切割模板和编号"
  - date: "2026-10-03"
    focus: "乳胶漆达到安装条件后完成明线/灯具并做电工终检"
    execution_gate: "相关墙面达到厂家允许安装和触碰的干燥状态"
    tasks:
      - "按冻结图纸完成放样、空槽、穿线、编号和分回路接线"
      - "普通PVC明线槽优先水泥钉/钢钉或适配基层的免钉方式；不为此预购冲击钻"
      - "厨房双层台面灯带本轮不做"
      - "合格电工完成绝缘、极性、保护器匹配、插座接线和各级漏保动作等终检；无法完成专业检测的回路保持断开"
    electrical_stop_rule: "专业检测与记录完成前，新建固定线路不得通电；万用表不能替代绝缘电阻与漏保动作专业检测"
  - date: "2026-10-04"
    focus: "总验收、保洁、留档与返程缓冲"
    tasks:
      - "不再安排不可中断的新施工"
      - "关键回路/漏保复查、渗漏与卫生间状态确认"
      - "形成门窗、材料和未完事项清单"
      - "施工照片、尺寸、线路编号和剩余材料留档"
      - "工具归位、垃圾清运、离场前关水并断非必要电"
      - "非安全关键未完项统一转入1月收尾"

between_main_window_and_january:
  - "不安排装修专项往返，也不依赖代理人执行需要现场判断的施工"
  - "门窗商按9/28尺寸生产并保管，约定1月中旬安装"
  - "远程整理逐回路线图、地板编号、门窗验收和马桶购买清单"
  - "顶楼雨漏如仍持续，由物业/防水人员处理屋面迎水面；业主不自行登高"

january_single_worker_sequence:
  - order: 1
    item: "检查墙面、天花板水迹、桌面、瓷砖漆和漏水痕迹"
  - order: 2
    item: "接收商家安装三扇门与全部防猫纱窗并拍照验收"
  - order: 3
    item: "按主窗口示范完成剩余石塑地板、踢脚线和压条"
  - order: 4
    item: "若明线未完成，只在断电状态下按编号图做机械收尾；不现场改变回路，不在专业门禁未关闭时端接或通电"
  - order: 5
    item: "购买350mm坑距马桶，优先含送货安装"
  - order: 6
    item: "浴室柜、衣柜架和洗烘机按预算门禁决定是否延期"
  - order: 7
    item: "深度保洁、移除化学品与碎料，执行三猫入住验收"

