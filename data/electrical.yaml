design_principles:
  - "DIY优先：先最小化重复穿洞、并行长线、集中大分线盒和设备盒内粗线弯折，再在既定5回路约束下做功能隔离"
  - "采用连续沿墙主干+就地T接/短尾线的施工语言；同一物理线槽可并行容纳不同回路，但各回路L/N必须始终独立，严禁共享N"
  - "灯具按场景分区但随所在空间回路供电；客厅JZ-N2双键分别控制基础灯和餐区灯，沙发背景灯改用独立常电插座"
  - "智能控制不能替代本地实体控制；网络、Home Assistant或云端故障时仍能手动开关基础照明"
  - "新建照明/开关/普通插座短支线优先统一2.5mm²，减少SKU和缩径保护判断；设备端子须明确支持2.5mm²"
  - "PCT只是连接器，不提供过载、短路或漏电保护；上级≤32A只是端子必要条件，还须按最小下游导线载流能力匹配保护器"
  - "除设备说明或现场核算要求更大截面外，新建小支线默认采用适用于固定敷设的2×2.5mm²两芯护套线；不再为照明单独采购1.5mm²"
  - "剩余蓝色6mm²线优先只作为中性导体候选，不把端部胶布改色直接视为相线方案获批"
  - "允许三孔面板进入两线制方案，但PE端子保持未连接并粘贴“本户无PE”标识；严禁N/PE短接或借用水管、燃气管作接地"
  - "配电箱漏保与设备末端漏保属于风险降低措施，不补足PE，也不把无PE设备标记为接地验收合格"
  - "保留2026-08新换的主配电箱及C40/C32五个支路器件；它们只作为上游馈线保护，不直接作为2.5mm²末端的最终过流保护。紧邻主箱增加一个明装副保护盒，在各回路缩径/进入新线路前设置C20过流保护基线"
  - "主配电箱内部不更换器件；仅由合格电工从现有五个支路安全接出到邻近副保护盒并核相/核N、复紧端子。业主DIY范围从副保护盒出线端之后开始"

provisional_five_circuit_allocation:
  recommendation: "以配电箱、门洞和墙面实际路径为约束；四个既有暗盒没有暗管，不再作为穿线孔。五路按卧室、厨房、客厅生活、客厅高负载、卫生间形成独立明装路径"
  circuits:
    - id: RCBO-01
      existing_device_type: "漏电保护器"
      scope: ["卧室普通插座", "卧室已有空调", "卧室固定照明"]
      route: "副保护盒后以6mm² L/N从配电箱向北，沿卧室门头进入卧室并贴西墙高位走；B1分JZ-N2/床南并继续，B2分卧室空调/床北后结束；吊扇不接入"
      reason: "卧室所有新建用电共用同一受RCBO保护的空间主干，避免重复绕门和多条长线"
      conductor: "6mm²主干计划下料4.5m/根；所有新建插座、照明和开关短支线统一2.5mm²"
      status: planned_pending_setout_and_appliance_nameplate
    - id: RCBO-02
      existing_device_type: "漏电保护器"
      scope: ["厨房插座", "厨房固定设备", "厨房固定照明"]
      route: "副保护盒后与卧室路一起向北；卧室路退出后继续到厨房门区，沿门头进入厨房；K1分主灯/入口开关并继续向西，K2在西墙分家电组"
      reason: "厨房负载集中且路径短；照明并入厨房RCBO可避免从走廊重复绕门敷设长线"
      conductor: "6mm²主干计划下料5.5m/根；所有新建插座、照明和开关短支线统一2.5mm²"
      status: planned_pending_setout_and_appliance_nameplate
    - id: RCBO-03
      existing_device_type: "漏电保护器"
      scope: ["玄关设备架常电", "走廊A/B生活照明", "客厅普通插座", "客厅洗烘一体机", "洗烘旁两个小厨电五孔点", "客厅主灯和餐灯"]
      route: "副保护盒后从配电箱向南，经入户门头到玄关南墙后向西；H1分设备架/灯带，继续到客厅通道后沿侧墙/门头进入客厅；L1分洗烘/餐桌/JZ-N2，主干沿客厅高位向西再沿西墙向北到W1分书桌/沙发/扫地机/投影"
      reason: "把真正需要长距离绕行的负载压缩到一条生活主干；冰箱和客厅空调从该长主干剥离"
      conductor: "6mm²主干计划下料10m/根；库存蓝色线只作N，另购同类型合规相色6mm²作L；所有末端统一2.5mm²"
      status: planned_pending_setout_and_washer_nameplate
    - id: MCB-04
      existing_device_type: "空气开关"
      physical_position: 4
      scope: ["客厅已有空调", "客厅冰箱"]
      route: "副保护盒C20后从配电箱向南，经入户门头和玄关南墙向西，与RCBO-03相邻但独立进入客厅；沿客厅南侧高位最短墙边路径到A1，一分二供客厅空调与冰箱"
      reason: "空调和冰箱物理位置相邻且相对独立；用短主干释放RCBO-03容量，同时避免原MCB-04照明线路分别穿多个房间"
      conductor: "副箱C20后直接使用BVVB 2×2.5mm²，不使用6mm²主干；仍须按空调铭牌和启动电流复核"
      protection: "MCB-04仅提供过流/短路保护；客厅空调端使用真正具备≤30mA剩余电流保护、L/N双极切断和TEST/RESET的固定式漏保插座/空调伴侣，冰箱端使用同等级漏保型插座；不得以普通智能插座或仅过欠压保护产品替代"
      status: panel_confirmed_pending_ac_and_product_measurement
    - id: MCB-05
      existing_device_type: "空气开关"
      physical_position: 5
      scope: ["卫生间专用馈线"]
      route: "副保护盒C20后从配电箱向南，经入户门头和玄关南墙向西，与第3/4路并行；到客厅通道附近脱离，利用侧墙/门头向北，再沿卫生间南墙高位向东并从门头进入；所有卫生间分支汇于BATH1"
      reason: "卫生间最终设备仍待定；保留独立馈线和本地总漏保，使后续设备变化仅影响卫生间门口之后的短距离布线"
      conductor: "副箱C20后直接使用BVVB 2×2.5mm²，不使用6mm²主干；按浴霸、镜柜/镜灯和照明总铭牌复核"
      protection: "卫生间全部负载必须位于2P、≤30mA剩余电流保护下游。当前先核验主箱第五位原位更换2P RCBO/RCD组合的可行性；若模数、端子方向或产品不合适，则回退到走廊A卫生间门外DIN明装RCD小箱"
      status: panel_confirmed_pending_bath_load_measurement
  physical_trunk_strategy:
    canonical_plan: "docs/plans/2026-09-30-final-surface-electrical-plan.md"
    wall_plane_rule: "高位主干默认固定在侧墙，不走天花板平面；普通墙以线槽上沿距顶约50mm为基准，可按墙面和障碍统一调整到约30~80mm"
    panel_split: "配电箱北向为RCBO-01卧室+RCBO-02厨房；南向为RCBO-03客厅生活+MCB-04空调冰箱+MCB-05卫生间"
    north_parallel_order: "卧室与厨房向北并行；厨房走得更远，优先放在更靠顶位置，卧室在卧室门头提前退出"
    south_parallel_order: "玄关公共墙段从靠顶到靠下建议MCB-04、RCBO-03、MCB-05；三路各用独立四分槽并排，不共享导体/N/端子"
    living_split: "RCBO-03和MCB-04经通道进入客厅；MCB-05在通道附近脱离并沿卫生间门墙进入卫生间"
    bend_rule: "90度转弯、续槽、绕门框只是机械路径变化，直接拼线槽，不因此增加接线盒"
    branch_rule: "只有导体接续、分叉、缩径才形成电气分支位置；当前最多B1/B2/K1/K2/H1/L1/W1/A1/BATH1共9处"
    pct42_fallback: "PCT-42约39.5×23.4×14.6mm必须用真实四分槽和真实导线试装；放得下时用低轮廓、可独立开盖的线槽配套分线构件/加宽分线腔；放不下则改86深明盒或约100×100×50分线盒"
    curtain_rod_fallback: "罗马杆不冲突则保持统一高位；冲突时优先整体调整支架，无法调整则整段线槽统一降低，禁止逐个支架蛇形绕行"
  unresolved_high_loads:
    - "两台空调铭牌功率、启动/最大输入电流和现有连接方式"
    - "洗烘一体机最终型号和最大输入功率"
    - "浴霸、浴室柜/镜灯是否保留及其功率、防护和接线方式"
    - "RCBO-03承担洗烘+客厅普通插座+普通照明时的同时负载"
    - "MCB-04承担客厅空调+冰箱时的额定值、线径及两个末端漏保插座/空调伴侣匹配"
    - "零火智能开关、普通开关和灯具端子是否均明确支持2.5mm²导体"
  fixed_physical_constraint: "2026-08新换的主配电箱箱体与前四路器件保留；紧邻主箱的副保护盒承担2.5mm²新线路的过流保护。第五路当前按“主箱原位2P、≤30mA保护优先，门外DIN RCD回退”二选一核验；无论采用哪种，卫生间全部负载都必须位于该剩余电流保护下游"
  downstream_protection_box:
    rationale: "用户不希望改动2026-08刚更换的主配电箱；同时GB 50054要求过负荷保护满足In≤Iz，因此C40/C32不能直接作为新2.5mm²末端的最终过流保护"
    location: "紧邻现有主配电箱的18模数明装DIN副箱，留出导线弯曲、五路隔离和至少4模数维护余量"
    upstream_feeders: "现有五支路到副箱的短连接段按各自上游C40/C32选线；为简化并利用库存，优先统一6mm² L/N短跳线，具体端接由电工确认"
    target_devices: "五路各设一只2P C20、6kA小型断路器作为过流保护基线；五路分别从原保护器引入，严禁用汇流排把不同上游回路并接。最终型号和2.5mm²敷设载流量由合格电工签字确认"
    downstream: "副箱C20之后才进入2.5mm²普通插座/照明/开关新线路；若某回路实测负载确需超过C20，不直接升额定值，而是重新核定线径或拆分负载"
    retain_main_panel: ["总开关NXB-63 C63", "63A自复式过欠压保护器", "前三路NXBLE-63YH C40/30mA", "第四路NXB-63 C32", "第五路现有NXB-63 C32在原位2P≤30mA方案通过时允许由电工更换；否则保留并采用门外RCD回退"]
    execution: "主箱到副箱的接出、核相/核N和端子复紧由合格电工完成；如采用第五路主箱原位更换，也仅由合格电工执行。业主DIY不进入带电主箱端接"

layered_residual_protection:
  coordination: "RCBO-01/02/03保留原C40/30mA作为上游剩余电流保护，副箱C20负责下游2.5mm²过流保护；MCB-04副箱C20后由客厅空调和冰箱两个末端漏保提供剩余电流保护；第五路在所有卫生间分支之前设置BATH-RCD-05，可由主箱原位2P≤30mA方案实现，若实物不匹配则由门外DIN RCD回退实现"
  product_minimums: ["额定剩余动作电流不大于30mA", "能够同时切断L和N", "具有TEST/RESET", "额定电流与上游C20、导线和负载匹配", "A型优先", "具备CCC/合格证及明确产品说明"]
  forbidden_substitutes: ["仅有过欠压保护的空调伴侣", "仅有计量或远程控制的智能插座", "单极只切相线的所谓漏保", "以末端漏保代替过流保护或PE"]
  devices:
    - { id: SRCD-AC-LIV, upstream: MCB-04, load: "客厅空调", form: "固定式漏保插座/空调伴侣；≤30mA、L/N双极切断、TEST/RESET", status: blocked_by_nameplate_and_product_manual }
    - { id: SRCD-FRIDGE, upstream: MCB-04, load: "冰箱", form: "漏保型插座；≤30mA、L/N双极切断、TEST/RESET", always_on: true, smart_switch_output: false, status: blocked_by_product_selection }
    - id: BATH-RCD-05
      upstream: MCB-05
      load: "卫生间全部用电"
      form: "2P、≤30mA；主箱第五位原位方案优先核验，门外2~4位DIN RCD小箱为回退"
      preferred_location: "主箱第五位原位（仅在模数、端子、额定参数和电工复核均通过时）"
      fallback_location: "走廊A卫生间门外，便于干燥环境检修和跳闸复位"
      upstream_segment: "在BATH-RCD-05之前不允许出现任何卫生间负载分支"
      branches: ["浴霸", "浴室柜/镜灯", "卫生间基础照明"]
      status: pending_main_panel_fit_or_fallback_selection

lighting_zones:
