onsite_assumptions:
  owner_tools: "业主本轮购买万用表，并准备绝缘螺丝刀、剥线钳、斜口钳/尖嘴钳；默认联系电工无工具上门"
  professional_test_tools: "绝缘电阻和漏保动作等专业检测仪表另行借/租或由终检人员提供；万用表不能替代"
  raceway_fixing: "普通PVC明线槽优先水泥钉/钢钉或适配基层的免钉方式；不把冲击钻列为预购工具，只有硬基层/承重固定确需膨胀件时再临时解决"
  timing: "9/28现场复核并冻结依赖铭牌/负载/路线的细节；10/3目标终装和终检"

design_principles:
  - "DIY优先：先最小化重复穿洞、并行长线、集中大分线盒和设备盒内粗线弯折，再在既定5回路约束下做功能隔离"
  - "采用连续沿墙主干+就地T接/短尾线的施工语言；同一物理线槽可并行容纳不同回路，但各回路L/N必须始终独立，严禁共享N"
  - "无主灯采用分散灯具和分区控制，不为每盏灯单独设置配电箱回路"
  - "智能控制不能替代本地实体控制；网络、Home Assistant或云端故障时仍能手动开关基础照明"
  - "新建照明/开关/普通插座短支线优先统一2.5mm²，减少SKU和缩径保护判断；设备端子须明确支持2.5mm²"
  - "PCT只是连接器，不提供过载、短路或漏电保护；上级≤32A只是端子必要条件，还须按最小下游导线载流能力匹配保护器"
  - "除设备说明或现场核算要求更大截面外，新建小支线默认采用适用于固定敷设的2×2.5mm²两芯护套线；不再为照明单独采购1.5mm²"
  - "剩余蓝色6mm²线优先只作为中性导体候选，不把端部胶布改色直接视为相线方案获批"
  - "允许三孔面板进入两线制方案，但PE端子保持未连接并粘贴“本户无PE”标识；严禁N/PE短接或借用水管、燃气管作接地"
  - "配电箱漏保与设备末端漏保属于风险降低措施，不补足PE，也不把无PE设备标记为接地验收合格"

provisional_five_circuit_allocation:
  recommendation: "以配电箱和四个既有穿线孔的方向为第一约束；按空间形成卧室、厨房、客厅生活、客厅高负载、卫生间五条路径，减少重复穿洞和跨房间回线"
  circuits:
    - id: RCBO-01
      existing_device_type: "漏电保护器"
      scope: ["卧室普通插座", "卧室已有空调", "卧室固定照明", "卧室吊扇"]
      route: "从配电箱向北，经E-HOLE-01一次进入卧室；入室后沿墙形成连续主干，就地T接插座、空调和照明/吊扇短支线"
      reason: "卧室所有新建用电共用同一受RCBO保护的空间主干，避免插座和照明分别重复穿E-HOLE-01"
      conductor: "普通插座、照明和开关新建短支线默认统一2.5mm²；空调及主干按铭牌、保护器和线路长度现场核算"
      status: blocked_by_panel_and_load_survey
    - id: RCBO-02
      existing_device_type: "漏电保护器"
      scope: ["厨房插座", "厨房固定设备", "厨房固定照明"]
      route: "从配电箱经走廊B，到E-HOLE-02一次进入厨房；沿厨房主要设备墙形成连续主干并就地T接"
      reason: "厨房负载集中且路径短；照明并入厨房RCBO可避免单独照明线再次穿E-HOLE-02"
      conductor: "普通插座、照明和开关新建短支线默认统一2.5mm²；厨房大负载及主干按铭牌、保护器和线路长度另算"
      status: blocked_by_panel_and_load_survey
    - id: RCBO-03
      existing_device_type: "漏电保护器"
      scope: ["玄关设备架常电", "走廊A/B生活照明", "客厅普通插座", "客厅洗烘一体机", "客厅普通照明"]
      route: "从配电箱沿走廊A向南形成全屋最长的生活主干；设备架就近T接，经E-HOLE-04进入客厅后沿一侧墙连续绕行至洗烘、沙发、扫地机、投影和书桌区域"
      reason: "把真正需要长距离绕行的负载压缩到一条生活主干；冰箱和客厅空调从该长主干剥离"
      conductor: "普通插座支线不小于2.5mm²候选；库存蓝色6mm²只可作为颜色一致的N主干候选，不因此提高保护器额定值"
      status: blocked_by_panel_and_load_survey
    - id: MCB-04
      existing_device_type: "空气开关"
      physical_position: 4
      scope: ["客厅已有空调", "客厅冰箱"]
      route: "从配电箱与RCBO-03在走廊A/E-HOLE-04前可共用物理路径但保持独立L/N；穿过E-HOLE-04后沿另一侧形成短主干，就地T分空调与冰箱，两端分别设置漏电保护"
      reason: "空调和冰箱物理位置相邻且相对独立；用短主干释放RCBO-03容量，同时避免原MCB-04照明线路分别穿多个房间"
      conductor: "按客厅空调与冰箱铭牌、MCB-04额定值、线路长度和端子能力现场核算"
      protection: "MCB-04仅提供过流/短路保护；客厅空调端使用真正具备≤30mA剩余电流保护、L/N双极切断和TEST/RESET的固定式漏保插座/空调伴侣，冰箱端使用同等级漏保型插座；不得以普通智能插座或仅过欠压保护产品替代"
      status: blocked_by_panel_load_and_product_survey
    - id: MCB-05
      existing_device_type: "空气开关"
      physical_position: 5
      scope: ["卫生间专用馈线"]
      route: "从配电箱沿走廊A到卫生间门外RCD-BATH-01；上游线路连续、受机械保护、无中间分支，RCD后再经E-HOLE-03进入卫生间分浴霸、浴室柜/镜灯和基础照明"
      reason: "卫生间最终设备仍待定；保留独立馈线和本地总漏保，使后续设备变化仅影响卫生间门口之后的短距离布线"
      conductor: "按浴霸、镜柜/镜灯、照明总铭牌、线路长度、敷设和MCB-05额定值现场核算"
      protection: "MCB-05本身不提供剩余电流保护；RCD-BATH-01优先装在走廊A卫生间门外的2~4位DIN明装箱内，所有卫生间负载均位于其下游"
      status: blocked_by_panel_load_and_product_survey
  physical_trunk_strategy:
    hall_to_living: "RCBO-03与MCB-04可在配电箱至E-HOLE-04前共用一根较宽明线槽；仅共享机械路径，不共享导体、N线、端子或保护器"
    after_e_hole_04: "过客厅门洞后自然分流：RCBO-03沿客厅生活区绕行；MCB-04只去空调/冰箱短路径"
    room_rule: "RCBO-01、RCBO-02分别只穿一次E-HOLE-01、E-HOLE-02；照明随所在房间RCBO主干就地分支"
    t_branch_rule: "主干沿顶边/高位线槽连续敷设，T接放在高位可检修带盖盒。普通插座只做一次垂直下落，低位盒为纯末端；低于1.8m部分用细管/窄槽保护。灯控采用高位主干→开关下落→受控相线回高位灯具的模式，往返导体集中在一条窄明线槽内。投影仪、空调、油烟机等高位设备直接从高位主干就近短接"
  unresolved_high_loads:
    - "两台空调铭牌功率、启动/最大输入电流和现有连接方式"
    - "洗烘一体机最终型号和最大输入功率"
    - "浴霸、浴室柜/镜灯是否保留及其功率、防护和接线方式"
    - "RCBO-03承担洗烘+客厅普通插座+普通照明时的同时负载"
    - "MCB-04承担客厅空调+冰箱时的额定值、线径及两个末端漏保插座/空调伴侣匹配"
    - "零火智能开关、普通开关、吊扇调速器和灯具端子是否均明确支持2.5mm²导体"
  fixed_physical_constraint: "第4、5支路位均只能安装空气开关，不能改装漏保；MCB-04采用空调/冰箱各自末端漏保，MCB-05采用卫生间门外RCD-BATH-01总漏保"

layered_residual_protection:
  coordination: "RCBO回路已具备剩余电流保护；MCB-04以两个负载端各自漏保补充保护，MCB-05在卫生间全部负载分支前设置总RCD。若RCBO回路另加设备级漏保，接受上下级30mA非选择性动作并分别测试"
  product_minimums: ["额定剩余动作电流不大于30mA", "能够同时切断L和N", "具有TEST/RESET", "额定电流与上游保护器、导线和负载匹配", "具备CCC/合格证及明确产品说明"]
  forbidden_substitutes: ["仅有过欠压保护的空调伴侣", "仅有计量或远程控制的智能插座", "单极只切相线的所谓漏保", "以末端漏保代替过流保护或PE"]
  devices:
    - { id: SRCD-AC-BED, upstream: RCBO-01, load: "卧室空调", form: "设备级漏保/空调伴侣仅作可选附加保护", status: blocked_by_nameplate_and_product_manual }
    - { id: SRCD-WASHER, upstream: RCBO-03, load: "洗烘一体机", form: "设备级漏保仅作可选附加保护", always_on: true, smart_switch_output: false, status: blocked_by_appliance_model }
    - { id: SRCD-DISHWASHER, upstream: RCBO-02, load: "现有洗碗机", form: "设备级漏保候选", always_on: true, smart_switch_output: false, status: blocked_by_appliance_model_and_connection_survey }
    - { id: SRCD-AC-LIV, upstream: MCB-04, load: "客厅空调", form: "固定式漏保插座/空调伴侣；≤30mA、L/N双极切断、TEST/RESET", status: blocked_by_nameplate_and_product_manual }
    - { id: SRCD-FRIDGE, upstream: MCB-04, load: "冰箱", form: "漏保型插座；≤30mA、L/N双极切断、TEST/RESET", always_on: true, smart_switch_output: false, status: blocked_by_product_selection }
    - id: RCD-BATH-01
      upstream: MCB-05
      load: "卫生间全部用电"
      form: "2P、≤30mA RCD，2~4位DIN导轨明装小箱"
      preferred_location: "走廊A卫生间门外，便于干燥环境检修和跳闸复位"
      fallback_location: "只有在产品说明、安装区域和防护条件均确认合格时才考虑卫生间内干区高位"
      upstream_segment: "连续、受机械保护、无中间接头、无任何负载分支"
      branches: ["浴霸", "浴室柜/镜灯", "卫生间基础照明"]
      status: blocked_by_panel_load_product_and_route_survey
    - { id: SRCD-BATH-HEATER, upstream: RCD-BATH-01, load: "浴霸", form: "是否另设设备级漏保由最终产品说明和接线形式决定", smart_control: forbidden, status: blocked_by_product_manual_and_splash_survey }
    - { id: SRCD-BATH-MIRROR, upstream: RCD-BATH-01, load: "浴室柜/镜灯", form: "最终按成品插头或固定接线说明决定连接方式", status: blocked_by_product_manual_and_splash_survey }

lighting_zones:
  - id: LZ-01
    room: hall_a
    fixture: "220V柔性灯带候选"
    target: "玄关和走廊A基础照明"
    controls: ["本地实体控制", "智能插座或智能开关"]
    preferred_connection: "若具体产品明确支持固定接线：MCB-04受控线在可检修带盖接线盒内，连接厂家专用整流/电源接头，再接灯带；不是建筑线直碰灯带铜箔"
    plug_in_alternative: "带厂家成套电源接头和成型插头的灯带接RCBO-03所供玄关常电插座，再通过有实体按钮的智能插座控制"
    forbidden: ["建筑导线与灯带铜箔/软引线裸接", "把接头埋进腻子或不可开启线槽", "剪切端不装绝缘端帽", "只保留依赖网络的控制方式"]
    status: selected_pending_product
  - { id: LZ-02, room: hall_b, fixture: "小型漫射吸顶灯或壁灯", controls: ["普通实体开关"], status: planned }
  - { id: LZ-03, room: living_room, fixture: "明装轨道射灯/洗墙灯", controls: ["零火智能墙壁开关优先"], status: planned }
  - { id: LZ-04, room: living_room, fixture: "落地灯、书桌灯等插接式任务灯", controls: ["灯具开关或智能插座"], status: planned }
  - { id: LZ-05, room: bedroom, fixture: "暖色环境灯+床头/窄桌任务灯", controls: ["门口普通开关或零火智能开关", "床头无线场景按钮可选"], status: planned }
  - { id: LZ-06, room: kitchen, fixture: "基础漫射灯", controls: ["普通实体开关"], status: planned }
  - { id: LZ-07, room: kitchen, fixture: "台面任务灯/灯带", controls: ["入住后按需"], status: deferred_until_after_move_in, note: "厨房双层台面灯带本轮不做；入住后如确有需要，优先成套插接式低压任务灯/灯带，避免新增固定220V线路" }
  - { id: LZ-08, room: bathroom, fixture: "防潮基础灯+镜前灯预留", controls: ["普通实体开关优先"], status: blocked_by_safety_review }
  - { id: LZ-09, room: balcony, fixture: "充电灯或开门时临时插接灯具", controls: ["灯具本体开关"], status: deferred_until_after_move_in, permanent_power: false }

lighting_selection:
  color_temperature_k: "2700至3000"
  color_rendering_index: "优先Ra/CRI≥90"
  glare: "优先带扩散罩、洗墙或间接光；避免视线直视高亮灯珠"
  replaceability: "优先标准化、可单独更换的灯具或电源接头"

terminal_policy:
  strategy: "分布式T接优先，不再把六个集中JB节点当作固定拓扑或采购数量"
  device_role: "连接器只作连接/分线，不提供过载、短路、漏电保护；上游保护器必须保护全路径最小截面导线"
  trunk_branch_candidate: "固定建筑布线适用、铜导体、额定电压/电流明确、主线与支线截面范围分别明确的T接/分支连接器"
  selection_gate: "现场确认主干/支线线种与截面、保护器额定值、连接器认证和说明书后再选型；不得仅因‘免剥’或‘支持6mm²’下单"
  enclosure: "T接节点优先放在顶边/高位主干旁的独立带盖可开启明装接线盒内；低位插座盒原则上只收一根末端支线。仅当某个特殊点位与主干同高且确有检修空间时才允许复用设备盒"
  rules:
    - "主干不断是施工便利目标，不要求绝对免剥；若正规产品要求局部剥除绝缘并机械压紧，按说明施工"
    - "严禁汽车线束类廉价穿刺夹用于220V固定住宅布线"
    - "L和N分别连接；不同回路不得共用N、端子或下游连接器"
    - "库存蓝色6mm²只作为N候选；不得靠端部胶带把整段蓝线改作L"
    - "普通设备端子只接短尾线，不把6mm²主干直接硬塞进普通插座、灯具或开关"
  procurement:
    status: blocked_by_onsite_wire_and_terminal_survey
    physical_quantity: null
    note: "取消原PCT-62+五孔型固定两包最低购物车；节点数按现场连续主干和实际点位核算"

branch_nodes:
  model: "distributed_along_trunk"
  fixed_count: null
  examples:
    - { id: TN-BED, circuit: RCBO-01, pattern: "卧室高位主干沿顶边走；在床侧/空调/调速器对应上方高位T接，再垂直下落到低位点；高位空调可就近短接" }
    - { id: TN-KIT, circuit: RCBO-02, pattern: "厨房高位主干沿设备墙上沿走；在热水器、油烟机、台面、洗碗机和灯位上方高位T接，向下/向设备短支" }
    - { id: TN-HALL-LIV, circuit: RCBO-03, pattern: "走廊/客厅主干尽量保持在顶边高位；每个低位插座在对应上方T接后垂直下落，投影仪等高位设备直接从高位主干就近分支" }
    - { id: JB-LIV-HIGH, circuit: MCB-04, branches: ["SRCD-AC-LIV→客厅空调", "SRCD-FRIDGE→冰箱"], note: "短主干就地T分；两端各自漏保，不与RCBO-03电气连接" }
    - { id: JB-BATH, circuit: MCB-05, upstream_node: RCD-BATH-01, branches: ["浴霸", "浴室柜/镜灯", "卫生间基础照明"] }

outlet_groups:
  total_planned: 15
  bedroom:
