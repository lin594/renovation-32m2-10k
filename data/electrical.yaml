version: 1
updated: "2026-09-01"
status: preliminary_discussion_baseline
drawing_property: "讨论方案，不是施工图或通电批准；无PE为既定条件，线径、保护器、端子及绝缘/极性/漏保测试结果仍须现场核验与合格电工复核"

confirmed_conditions:
  wiring_method: "全屋明装线槽/明管"
  installation_sequence: "乳胶漆达到产品允许安装和触碰的干燥状态后施工"
  protective_earth: "已确认老小区户内仅有L/N两线、无可用PE；四楼无法独立增设接地"
  remaining_conductor: "约60m蓝色6mm²铜线"
  panel_markings: "业主记忆为约500V、36A，完整型号、脱扣额定值、极数、漏电动作参数均待拍照"
  branch_device_capacity: "共5个支路位置：3个漏电保护器+2个空气开关，不增加不存在的回路位置"
  home_server: "EVE V1可长期运行，固定放在走廊A南墙玄关置物架"
  balcony:
    no_electrical_penetration: true
    permanent_power: deferred
    current_phase_rule: "不钻孔、不把电线夹过阳台移门、不设置永久220V线路"
    later_option: "入住后再决定充电灯，或仅在阳台门开启时使用可拔除的临时插电设备"
  bedroom_fan_existing_wiring:
    surface_segment: "E-HOLE-01至卧室西墙E-BOX-BED-FAN调速器暗盒"
    concealed_segment: "E-BOX-BED-FAN至卧室中心吊扇"
    reuse_gate: "施工前完成通断与绝缘检查"

design_principles:
  - "无主灯采用分散灯具和分区控制，不为每盏灯单独设置配电箱回路"
  - "智能控制不能替代本地实体控制；网络、Home Assistant或云端故障时仍能手动开关基础照明"
  - "6mm²主干不能自动保护缩径后的1.5mm²支路；支路保护器必须按最小导线、敷设方式和负载匹配"
  - "PCT只是连接器，不提供过载、短路或漏电保护；上级≤32A只是端子必要条件，还须按最小下游导线载流能力匹配保护器"
  - "照明支路暂按1.5mm²铜线讨论；普通插座支路不小于2.5mm²；空调、厨房和洗烘等大负载按铭牌与线路长度另算"
  - "剩余蓝色6mm²线优先只作为中性导体候选，不把端部胶布改色直接视为相线方案获批"
  - "允许三孔面板进入两线制方案，但PE端子保持未连接并粘贴“本户无PE”标识；严禁N/PE短接或借用水管、燃气管作接地"
  - "配电箱漏保与设备末端漏保属于风险降低措施，不补足PE，也不把无PE设备标记为接地验收合格"

provisional_five_circuit_allocation:
  recommendation: "以配电箱和四个既有穿线孔的方向为第一约束；五个保护器只形成五个回路，房间内灯光分区由下游开关完成"
  circuits:
    - id: RCBO-01
      existing_device_type: "漏电保护器"
      scope: ["卧室普通插座", "卧室已有空调"]
      route: "从配电箱向北，经卧室门洞最北端E-HOLE-01进入卧室后沿墙分配"
      reason: "卧室与客厅方向相反，使用独立穿线孔，不与客厅共用绕行主干"
      conductor: "混合负载及缩径方式待铭牌和保护器核验；普通插座不小于2.5mm²候选"
      status: blocked_by_panel_and_load_survey
    - id: RCBO-02
      existing_device_type: "漏电保护器"
      scope: ["厨房插座", "厨房固定设备"]
      route: "从配电箱经走廊B，到厨房门洞最西端E-HOLE-02进入厨房"
      reason: "厨房有独立近端穿线孔，负载集中且涉及用水"
      conductor: "普通插座不小于2.5mm²候选；厨房设备按铭牌、同时使用和线路长度核算"
      status: blocked_by_panel_and_load_survey
    - id: RCBO-03
      existing_device_type: "漏电保护器"
      scope: ["客厅普通插座", "客厅已有空调", "客厅冰箱", "客厅洗烘一体机", "玄关设备架常电插座"]
      route: "从配电箱沿走廊A向南形成一条主干；设备架在走廊A就近分支，经E-HOLE-04进入客厅，不再经E-HOLE-03进入卫生间"
      reason: "洗衣机、冰箱和客厅设备处在同一客厅方向；卫生间改由MCB-05专用馈线及末端双极漏保隔离"
      conductor: "普通插座不小于2.5mm²候选；客厅空调、洗烘机、冰箱和普通插座同时负载必须现场核算"
      status: blocked_by_panel_and_load_survey
    - id: MCB-04
      existing_device_type: "空气开关"
      physical_position: 4
      scope: ["卧室固定照明", "卧室吊扇", "厨房固定照明", "走廊A/B固定照明", "客厅固定照明", "走廊A 220V灯带"]
      route: "由JB-L4形成非卫浴照明分配，分别经E-HOLE-01进入卧室、E-HOLE-02进入厨房、E-HOLE-04进入客厅，并在走廊A/B就近分支"
      reason: "合并原两条照明回路，释放第5空开作为卫生间专用馈线；灯具仍由下游开关分区控制"
      conductor: "1.5mm²铜线候选"
      protection: "空开类型不可改为漏保；B10/C10只作为初筛，仍须由合格电工结合线长、敷设、负载和产品确认保护1.5mm²后才安装，否则采用插接式照明过渡"
      status: blocked_by_panel_survey
    - id: MCB-05
      existing_device_type: "空气开关"
      physical_position: 5
      scope: ["卫生间专用馈线"]
      route: "从配电箱沿走廊A到E-HOLE-03，使用连续、受机械保护且无中间接头的线路进入卫生间后立即接入RCD-BATH-01"
      reason: "第5位不能改装漏保，因此只作为卫生间专用上游空开；浴霸、镜柜和照明全部置于末端双极漏保下游"
      conductor: "按浴霸、镜柜、照明总铭牌、线路长度、敷设和MCB-05额定值现场核算，不预填线径"
      protection: "MCB-05本身不提供剩余电流保护；所有卫生间负载必须先经过RCD-BATH-01，漏保箱前不设任何分支"
      status: blocked_by_panel_load_product_and_dry_zone_survey
  hall_power_split:
    fixed_lighting: "由MCB-04供电；220V灯带硬接仍须经过厂家专用电源/整流接头并在可检修盒内端接"
    always_on_sockets: "光猫、路由器、EVE V和插接式智能灯带方案由RCBO-03在走廊A主干就近分支，不接MCB-04/05"
    rationale: "玄关常电仍有RCBO-03保护；固定照明合并到MCB-04，MCB-05释放为卫生间专用馈线"
  unresolved_high_loads:
    - "客厅空调与卧室空调的铭牌功率、启动电流和现有临时回路线径"
    - "洗烘一体机最终型号和最大功率"
    - "浴霸是否保留及其功率和防护条件"
    - "客厅空调、洗烘机、冰箱和客厅插座同时运行时RCBO-03是否过载"
    - "浴霸、除雾镜柜和卫生间照明总负载是否与MCB-05、馈线及RCD-BATH-01匹配"
    - "卧室空调与卧室插座同时运行时RCBO-01是否过载"
    - "厨房设备同时运行时RCBO-02是否过载"
  fixed_physical_constraint: "第4、5支路位均只能安装空气开关，不能改装漏保；MCB-05可作卫生间专用馈线，但卫生间内任何分支前必须另设双极30mA末端漏保"

layered_residual_protection:
  coordination: "接受上下级30mA漏保非选择性动作；故障时可能同时跳闸，分别测试并记录，不宣称只切断末级"
  product_minimums: ["额定剩余动作电流不大于30mA", "能够同时切断L和N", "具有TEST/RESET", "额定电流与插头、导线和设备负载匹配", "具备CCC/合格证及明确产品说明"]
  forbidden_substitutes: ["仅有过欠压保护的空调伴侣", "仅有计量或远程控制的智能插座", "单极只切相线的所谓漏保", "以末端漏保代替过流保护或PE"]
  devices:
    - { id: SRCD-AC-BED, upstream: RCBO-01, load: "卧室空调", form: "插座式漏保/空调伴侣", status: blocked_by_nameplate_and_product_manual }
    - { id: SRCD-AC-LIV, upstream: RCBO-03, load: "客厅空调", form: "插座式漏保/空调伴侣", status: blocked_by_nameplate_and_product_manual }
    - { id: SRCD-WASHER, upstream: RCBO-03, load: "洗烘一体机", form: "专用插座式漏保", always_on: true, smart_switch_output: false, status: blocked_by_appliance_model }
    - { id: SRCD-DISHWASHER, upstream: RCBO-02, load: "现有洗碗机", form: "专用插座式漏保候选", always_on: true, smart_switch_output: false, status: blocked_by_appliance_model_and_connection_survey }
    - id: RCD-BATH-01
      upstream: MCB-05
      load: "卫生间全部用电"
      form: "双极30mA末端漏保及可检修防护箱"
      preferred_location: "卫生间内实测干区高位，E-HOLE-03后尽快接入"
      fallback_location: "无法确认合格干区时自动改到走廊A门外"
      upstream_segment: "连续、受机械保护、无中间接头、无任何分支"
      branches: ["浴霸", "智能除雾镜柜", "卫生间防潮照明"]
      status: blocked_by_panel_load_product_and_dry_zone_survey
    - { id: SRCD-BATH-HEATER, upstream: RCD-BATH-01, load: "浴霸", form: "说明允许插头时用防水插座式漏保；否则双极隔离开关+带盖接线盒", smart_control: forbidden, status: blocked_by_product_manual_and_splash_survey }
    - { id: SRCD-BATH-MIRROR, upstream: RCD-BATH-01, load: "智能除雾镜柜", form: "说明允许插头时用防水插座式漏保；否则双极隔离开关+带盖接线盒", status: blocked_by_product_manual_and_splash_survey }

lighting_zones:
  - id: LZ-01
    room: hall_a
    fixture: "220V柔性灯带候选"
    target: "玄关和走廊A基础照明"
    controls: ["本地实体控制", "智能插座或智能开关"]
    preferred_connection: "若具体产品明确支持固定接线：MCB-04受控线在可检修带盖接线盒内，连接厂家专用整流/电源接头，再接灯带；不是建筑线直碰灯带铜箔"
    plug_in_alternative: "带厂家成套电源接头和成型插头的灯带接RCBO-03所供玄关常电插座，再通过有实体按钮的智能插座控制"
    forbidden: ["建筑导线与灯带铜箔/软引线裸接", "把接头埋进腻子或不可开启线槽", "剪切端不装绝缘端帽", "只保留依赖网络的控制方式"]
    status: selected_pending_product
  - { id: LZ-02, room: hall_b, fixture: "小型漫射吸顶灯或壁灯", controls: ["实体开关"], status: planned }
  - { id: LZ-03, room: living_room, fixture: "明装轨道射灯/洗墙灯", controls: ["实体或智能墙壁开关"], status: planned }
  - { id: LZ-04, room: living_room, fixture: "落地灯、书桌灯等插接式任务灯", controls: ["灯具开关或智能插座"], status: planned }
