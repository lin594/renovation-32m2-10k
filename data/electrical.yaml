  - { id: JB-L5, circuit: MCB-05, terminal: PCT-62, status: active_planned, branches: ["走廊A灯带", "走廊B灯", "客厅固定照明"] }
  - { id: JB-R3, circuit: RCBO-03, terminal: PCT-62, status: active_planned, branches: ["玄关设备架", "卫生间", "客厅"] }
  - { id: JB-BED, circuit: RCBO-01, terminal: PCT-62, status: active_planned, branches: ["卧室空调", "床北插座", "床南插座"] }
  - { id: JB-KIT, circuit: RCBO-02, terminal: PCT-62, status: active_planned, branches: ["燃气热水器", "油烟机", "台面电器"] }
  - { id: JB-LIV, circuit: RCBO-03, upstream_node: JB-R3, terminal: PCT-62, status: active_planned, branches: ["客厅空调", "洗烘一体机", "普通插座链"] }

