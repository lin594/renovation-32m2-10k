bedroom_detail:
  fan_controller:
    box: E-BOX-BED-FAN
    box_type: existing_recessed
    exclusive_use: "吊扇调速器"
    circuit: MCB-04
    feed: "E-HOLE-01后沿西墙明装"
    fan_output: "调速器至吊扇复用既有暗埋线"
    test_before_reuse: ["通断", "绝缘"]
  bed_south_socket: { box_type: new_surface_mounted, placement: "调速器相邻但独立明盒", circuit: RCBO-01, separate_from_fan_control: true }
  bed_north_socket: { box_type: new_surface_mounted, placement: "床北侧", circuit: RCBO-01, separate_from_fan_control: true }
  expansion_rule: "单暗盒不足时采用原暗盒+相邻明装盒；不同回路分盒、分线槽、分端子"

cable_plan:
  wiring_system: "BVVB护套线为主；不采用蓝线改色作为新购线路方案"
  buy_now:
    - { item: "BVVB 2×2.5mm²", quantity_m: 50, rolls: 1, purpose: "插座支路", requirements: ["内芯为合规相线色+淡蓝色", "CCC", "合格证"] }
  socket_takeoff:
    estimated_net_m: "42-45"
    reserve_ratio: 0.10
    october_1_gate: "现场按墙面实际路线复测；实测净长>45m时，含10%余量将超过50m，使用京东次日补第二卷"
  add_to_cart_only:
    - { item: "BVVB 2×1.5mm²", quantity_m: 50, purpose: "固定照明成对供电" }
    - { item: "BV 1×1.5mm²红色", quantity_m: 50, purpose: "开关回线及吊扇受控相线" }
  lighting_purchase_gate:
    pass_if: "10月1日确认两只照明空开为B10/C10，或合格电工明确确认其保护1.5mm²线路"
    on_pass: "购买两种1.5mm²线各50m"
    on_fail: "不安装1.5mm²固定照明；走廊灯带改接RCBO-03常电插座+智能插座，其他空间暂用插接式灯具"
  rejected_option: "不采用全屋2.5mm²照明；它增加成本、线槽尺寸与盒内拥挤，也不能修复保护器不匹配"
  trunking_rule: "按BVVB成品实际外径选线槽，成品线缆占槽内截面约40%以内，并为未来PE留空间"
  design_minimums: { lighting_mm2: 1.5, sockets_mm2: 2.5 }

hall_a_shelf:
  location: "走廊A南墙壁挂置物架，背面贴南墙锚固"
  wall_anchor: hall_a_south_wall
  equipment: ["光猫", "Wi-Fi路由器", "EVE V1", "走廊A灯带电源接头/智能控制（如采用插接方案）"]
  power: "至少4个常电插位；光猫、路由器和EVE V不接在会被照明自动化关闭的插座上"
  network: "入户网线到光猫，路由器到EVE V仅用架内短网线，不再为家庭中枢跨房间布网线"
  requirements: ["通风", "可检修", "电源与弱电分区整理", "电源按钮可触达", "线缆有应力释放"]
  eve_v:
    roles: ["Home Assistant主机", "玄关家庭电子相册", "家庭信息显示器"]
    operation: "长期运行，屏幕可定时关闭但主机和虚拟机不休眠"
    september_acceptance: ["连续运行72小时", "断电恢复流程记录", "虚拟机和Home Assistant自启动", "有线网络稳定", "远程桌面可用"]

onsite_freeze_gate:
  date: "2026-10-01"
  required_evidence:
    - "每个配电箱器件正面和侧面清晰照片"
    - "记录C/B曲线及额定电流、极数、漏电动作电流、分断能力和型号"
    - "逐回路确认现有临时线路和实际负载"
    - "测量各端点路线长度和同槽导线数量"
    - "按E-HOLE-01卧室、E-HOLE-02厨房、E-HOLE-03卫生间、E-HOLE-04客厅逐孔确认路线和分支"
    - "确认走廊A灯带长度、安装高度、剪切单位、成套电源接头与末端封帽"
  outputs: ["最终回路表", "线径和颜色表", "保护器匹配表", "2/3/5孔端子及分配块数量", "逐房间材料包"]
