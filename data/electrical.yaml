terminal_policy:
  candidate_product: "TYO PCT系列（由业主提供参数，型号/认证实物待验）"
  pct_42: { topology: "2进4出：L/N各进一根，分出2组L/N", advertised_voltage_v: 600, advertised_current_a_per_pole: 32, strip_length_mm: 10, hard_wire_mm2: "0.2-6", flexible_wire_mm2: "0.2-4" }
  pct_62: { topology: "2进6出：L/N各进一根，分出3组L/N", advertised_voltage_v: 600, advertised_current_a_per_pole: 32, strip_length_mm: 10, hard_wire_mm2: "0.2-6", flexible_wire_mm2: "0.2-4" }
  aggregate_current_rule: "32A为每极全部进出线合计允许电流，不是每个出线口各32A"
  upstream_gate: "直接上级≤32A只是端子额定值门禁；保护器还必须不大于最小下游导线在实际敷设条件下允许值，并匹配负载与故障切断要求。任一条件未知即暂停接线和通电"
  device_role: "PCT仅作连接/分线，不是保护器，不能用端子额定值替代支路过载、短路、漏电和接地故障保护"
  enclosure: "每个节点固定在独立、带盖、可开启检修的约100×100×50mm明装盒内"
  logical_node_count: 6
  procurement: { physical_quantity: null, status: blocked_by_product_topology_and_protection_review }
  quantity_gate: "图纸固定六个逻辑分线节点；核对PCT-62与五孔接线型的认证、额定值、导线适配和保护器后，才批准两包最低采购"
  rules:
    - "L和N使用相互独立的极组/端子，不混接；本户无PE，不设置虚构PE极组；到货后必须用实物标识和通断测试确认PCT内部拓扑"
    - "端子必须安装在可开启的接线盒或配电箱内并固定"
    - "标称支持6mm²不等于允许从未知36A上级向2.5mm²分支；保护器门禁优先于孔径"
    - "软线接入需按产品要求使用适配端头，不用焊锡替代合规压接"
    - "插座由PCT分出短尾线，每个插座端子只压一根导线，不在插座螺丝下叠压多根导线或铜鼻子"
  product_family_plan:
    package_rule: "每个具体类型10只/包；不按全系列囤货"
    preferred_continuity: "穿墙线优先连续通过；需要分段时，接头只能放在穿线洞后立即可见、带盖、固定的检修盒中，不得位于墙洞内"
    branch_type: { candidate: "PCT-62二进六出", topology: "L/N各进一根，分出3组L/N", hard_wire_max_mm2: 6, planned_nodes: [JB-R3, JB-BED, JB-BATH], initial_packs: 1, gate: "确认内部极组、认证和32A总电流门禁" }
    splice_type: { candidate: "五孔接线型", hard_wire_max_mm2: 4, planned_nodes: [JB-KIT, JB-LIV, JB-L4], initial_packs: 1, rule: "L/N各一只；一孔进、四孔出；额定电流待核" }
    series_type: { candidate: "二极一进一出串联型", hard_wire_max_mm2: 4, initial_packs: 0, cart_only: true, buy_if: "连续穿线确实无法施工或维护" }
    initial_exclusions: ["PCT-42", "二孔/三孔/八孔接线型", "其他串联规格"]

